[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smeshariki-ai"
version = "0.1.0"
description = "Backend for the Smeshariki AI research project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smeshariki_ai"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
