[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[project]
name = "smeshariki-ai"
version = "0.1.0"
description = "Backend for the Smeshariki AI research project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0,<2",
    "argon2-cffi>=25.1.0,<26",
    "asyncpg>=0.32.0,<1",
    "fastapi>=0.141.1,<1",
    "litellm>=1.101.0,<2",
    "pydantic>=2.13.5,<3",
    "pyjwt>=2.15.1,<3",
    "redis>=8.1.0,<9",
    "sqlalchemy[asyncio]>=2.1.4,<3",
    "uvicorn>=0.52.4,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smeshariki_ai"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
