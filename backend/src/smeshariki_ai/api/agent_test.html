<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка агента</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 1.35rem; }
    #status { margin: 12px 0; color: GrayText; }
    #messages { min-height: 320px; max-height: 60vh; overflow-y: auto; padding: 12px;
      border: 1px solid GrayText; border-radius: 8px; }
    .message { margin: 8px 0; padding: 10px 12px; border-radius: 8px;
      white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { margin-left: 12%; background: color-mix(in srgb, Highlight 18%, Canvas); }
    .assistant { margin-right: 12%; background: color-mix(in srgb, GrayText 12%, Canvas); }
    .error { border: 1px solid #c33; }
    form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
    textarea { min-height: 72px; resize: vertical; padding: 10px; }
    button { padding: 9px 14px; cursor: pointer; }
    button:disabled, textarea:disabled { cursor: not-allowed; opacity: .6; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Тестовый интерфейс агента</h1>
      <button id="new-dialog" type="button">Новый диалог</button>
    </header>
    <p id="status" role="status">Подключение…</p>
    <section id="messages" aria-live="polite" aria-label="Сообщения"></section>
    <form id="message-form">
      <textarea id="request" required placeholder="Введите сообщение" aria-label="Сообщение"></textarea>
      <button id="send" type="submit">Отправить</button>
    </form>
  </main>
  <script>
    const statusNode = document.querySelector("#status");
    const messagesNode = document.querySelector("#messages");
    const form = document.querySelector("#message-form");
    const requestNode = document.querySelector("#request");
    const sendNode = document.querySelector("#send");
    const newDialogNode = document.querySelector("#new-dialog");
    let dialogId = null;
    let events = null;
    let ready = false;
    let processing = false;
    let submitting = false;
    let currentAssistant = null;
    let pendingEvents = [];

    function apiUrl(path) {
      return new URL(path.replace(/^\//, ""), document.baseURI);
    }

    function updateForm() {
      const disabled = !ready || processing || submitting;
      requestNode.disabled = disabled;
      sendNode.disabled = disabled;
    }

    function setStatus(text) {
      statusNode.textContent = text;
    }

    function addMessage(role, text) {
      const node = document.createElement("div");
      node.classList.add("message", role);
      node.textContent = text;
      messagesNode.append(node);
      messagesNode.scrollTop = messagesNode.scrollHeight;
      return node;
    }

    function applyAgentEvent(type, data) {
      if (submitting) {
        pendingEvents.push([type, data]);
        return;
      }
      if (type === "message_start") {
        processing = true;
        currentAssistant = addMessage("assistant", "");
        setStatus("Агент отвечает…");
      } else if (type === "message_delta") {
        if (!currentAssistant) currentAssistant = addMessage("assistant", "");
        currentAssistant.textContent += data.delta;
        messagesNode.scrollTop = messagesNode.scrollHeight;
      } else if (type === "message_end") {
        processing = false;
        currentAssistant = null;
        setStatus("Готово");
      } else if (type === "message_error") {
        processing = false;
        if (!currentAssistant) currentAssistant = addMessage("assistant", "");
        currentAssistant.classList.add("error");
        currentAssistant.textContent += currentAssistant.textContent ? "\n[Ошибка ответа]" : "Ошибка ответа";
        currentAssistant = null;
        setStatus(data.message || "Ошибка агента");
      }
      updateForm();
    }

    function bindAgentEvent(type) {
      events.addEventListener(type, (event) => {
        let data = {};
        try { data = JSON.parse(event.data); }
        catch { setStatus("Получено некорректное SSE-событие"); return; }
        applyAgentEvent(type, data);
      });
    }

    async function createDialog() {
      ready = false;
      processing = false;
      submitting = false;
      pendingEvents = [];
      currentAssistant = null;
      updateForm();
      setStatus("Создание диалога…");
      if (events) events.close();
      events = null;
      dialogId = null;
      messagesNode.replaceChildren();

      try {
        const response = await fetch(apiUrl("api/v1/dialogs"), { method: "POST" });
        if (!response.ok) throw new Error("create failed");
        dialogId = (await response.json()).dialog_id;
        setStatus("Подключение к потоку…");
        events = new EventSource(apiUrl(`api/v1/dialogs/${dialogId}/events`));
        events.addEventListener("ready", () => {
          ready = true;
          setStatus("Готово");
          updateForm();
          requestNode.focus();
        });
        bindAgentEvent("message_start");
        bindAgentEvent("message_delta");
        bindAgentEvent("message_end");
        bindAgentEvent("message_error");
        events.onerror = () => {
          ready = false;
          setStatus("Соединение с потоком потеряно; переподключение…");
          updateForm();
        };
      } catch {
        setStatus("Не удалось создать диалог");
        updateForm();
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const request = requestNode.value.trim();
      if (!request || !dialogId || !ready || processing || submitting) return;
      submitting = true;
      pendingEvents = [];
      updateForm();
      setStatus("Отправка…");
      try {
        const response = await fetch(apiUrl(`api/v1/dialogs/${dialogId}/messages`), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ request }),
        });
        if (response.status !== 202) throw new Error("submit failed");
        addMessage("user", request);
        requestNode.value = "";
        submitting = false;
        const buffered = pendingEvents;
        pendingEvents = [];
        for (const [type, data] of buffered) applyAgentEvent(type, data);
        if (!processing) setStatus("Запрос принят");
      } catch {
        submitting = false;
        pendingEvents = [];
        setStatus("Не удалось отправить сообщение");
      }
      updateForm();
    });

    newDialogNode.addEventListener("click", createDialog);
    window.addEventListener("beforeunload", () => { if (events) events.close(); });
    createDialog();
  </script>
</body>
</html>
