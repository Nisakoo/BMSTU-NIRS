id: taynoe_obshchestvo
title: Тайное общество
text: 'И что? Вот это вот называется секретик! Да.


  Кладёшь кусок фольги под стекло и закапываешь. Ну, можно класть пуговицу или другую какую-нибудь
  интересную штучку.


  Не понял! А в чём прикол? Как в чём? Приятное ощущение тайны. Все думают, что здесь ничего
  нет, кочка как кочка. И только ты знаешь, что здесь секретик.


  Я знаю про твои секретики. Ты знаешь про мои. Фух. У нас общая тайна. Знаешь, что это значит?
  Что? Что у нас тайное общество.


  Кто проговорится? Тому Согласен.


  А чё это вы тут делаете?


  Да так. Ерунда И зачем это вам? Мы не можем тебе сказать. Это не наша тайна. А чья? Тайного
  общества, если мы скажем нам Если мы скажем нам Тайное общество. Стёклышки и фантики. Ха-ха-ха.
  Ерунда какая. Ля-ля-ля-ля-ля-ля-ля-ля, ля-ля, ля-ля-ля-ля-ля-ля, ля.


  Нам нужно выработать тайный язык, который бы никто не понимал, кроме нас. Например, говорить
  слова наоборот:«Не привет», а-а, ну, не привет, авироп. Ну да.


  Я говорю тебе:"Ти vir", и никто не понимает, что на самом деле я сказал тебе Привет! Обычная
  конспирация.


  Эх, ёлки-галки!


  Так, чевип! Ха! Он всё слышал. Теперь мы должны либо принять его в тайное общество, либо
  в глубину зарывать. Очень глубоко не надо.


  Интересный ритуал. А какой в нём смысл?


  Ма-ма-ла. А какой в нём смысл? Тайна!


  Пока не доверяют.


  Бараш?


  — А ты чего здесь делаешь?— Я да тут ничего.


  — У кого чистая совесть, тому скрывать нечего! Покажи!— Нет.— Покажи, а! Покажи! Ну покажи,
  а!— Нет! Я дал клятву!— Ах так!


  Теперь я тебе тоже ничего не покажу!


  Вер.


  Ты чего? Какая главная тайна нашего общества? Взрывание секретиков Я зарыл их уже 200 штук!
  Молодец! Никому об этом не гугу.


  Тут до меня никак не доходит. Может, я не на той глубине их закапываю.


  Сколько тайн, сколько загадок. И никаких ответов.


  Всё хорошо, Бараш. Ты у своих.


  Ёжик мы здесь. Теперь в чём?


  Тайна.


  — Взрывание секретиков!— Зачем? В чём смысл? Зачем мы их зарываем? Никто не знает, что они
  там зарыты, а мы знаем приятные ощущения тайны. И всё.


  И всё. Только Сынок.


  Что?


  Ценак.


  Конец.'
