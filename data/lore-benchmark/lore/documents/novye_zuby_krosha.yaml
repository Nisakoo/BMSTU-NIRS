id: novye_zuby_krosha
title: Новые зубы Кроша
text: 'Это было очень нечестно. Именно в тот день, когда Крош готовился попробовать новый
  урожай моркови, у него начал шататься зуб.


  А вдруг зубы выпадет совсем.


  Ну что-то же надо делать — Кому, как не к Пину, главному знатоку зубчатых колёс, пойти попросить
  совета?— Э-э, если смотреть в корень дела, то зуб, кажется, шатается.— Я шатается. Есть
  подозрение, что он зуб, наверное, скоро выпадет.— А чё?


  Выпадает ещё и не такие выпадали! А не выпасть он никак не может.


  А может, к Совунье? Ну, как всегда? А? Она и зубы умеет лечить. Нет! Только не это!


  Ёлки-галки! Я придумал! Понимаете, если зубу будет некуда выпадать, то он просто вынужден
  будет что? Падать. То есть, я хотел сказать, что если вы перевернёте меня с ног на голову,
  то зуб будет выпадать обратно. А значит, рано или поздно растёт. Ага! Интересная гипотеза
  о в падении зуба.


  Здорово!


  Ой! Крош, с тобой всё в порядке! Не вопрос! Это была только проба! И вообще, скоро все начнут
  ходить на ушах. Это веселее! Бе-бе-бе-бе-бе! Твой зуб он в известном смысле выпал.


  Ой! А-а! Где мой зуб?


  Да, подходит! Можно зуб приклеивать обратно. Я имею суперклей. Но потом лучше ничего не
  грызть. И морковь тоже? К сожалению, и морковь на всякий случай. Нет, так не пойдёт.


  — А если всё-таки сходить к Совунье?— Говорят, она лечит совсем не больно.— А других вариантов
  нет?— Надо долго подумать.


  Ага! Кажется, я находил то, что нужно! Вот надевай.


  Ух ты есть вылитый вампир! А-а-на Ну, в принципе, неплохо. Просто ты как-то необычно выглядишь.
  Ну, мне пора. Ёжик, а ты куда?


  Зато таким зубом удобно грызть, как это, морковка. Сначала Крошу даже понравились новые
  зубы и то, как на него стали смотреть друзья с уважением, что ли, но потом всё обернулось
  по-другому.


  — Крош!— Это ты?— Это я, меня здесь нет.— Я тебя заметила.— Крош, вылезай!— А-а, вы играете
  в прятки?— А меня опять не взяли!— Ну, хватит прятаться! Немедленно уходи!— А то я обижусь.


  Привет! Нюша!


  Нюша! Что ж такое? Это же я, Крош!


  А! А теперь!


  И только тут Крош понял, что отныне он всегда будет одинок. Только ночь и Луна будут его
  ненадёжными спутниками.


  Если, конечно, он и дальше не отважится пойти к Совунье и лечить зубы.


  Ой.


  Ну, где у нас с тобой болит? Так. Посмотрим, посмотрим. Сильно болит. Давно болит. Да. Два-два
  с минусом тебе за такое поведение. Тебе ли не знать, что В таких случаях медлить нельзя!


  А ну-ка, пацаны, откройте-ка ваш рот! Просто возмутительно! Он ещё и боится! Открой рот!
  Я кому сказала?


  Я только посмотрю зубки белые зубки жгучие Что я вижу могу поспорить, ты здорово испугался,
  да?


  А зря! Поздравляю! Твои зубы в полном порядке! Но у меня же выпал зуб. У тебя выпал молочный
  зуб! А теперь на его месте режется коренной. Поэтому десна и болит. Я тебе сделаю отвар!


  И ты будешь полоскать им рот три раза в день! Боль и пройдёт! И тут Крош понял, что такое
  счастье. А ещё он подумал о том, что теперь, пока не вырастет новый зуб, будет гораздо удобнее
  свистеть.'
