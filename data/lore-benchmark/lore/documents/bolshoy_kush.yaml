id: bolshoy_kush
title: Большой куш
text: 'Ёжик, давай сыграем ещё раз. Ну, ладно, давай. Ну, в какой руке? Ну, в правой. А вот
  и нет. В левой! Ты опять проиграл! Тебе всегда везёт.


  Плохой машина! Жадный! Жадный обманщик! На! На! Ой! Ты чего это стал с железками разговаривать?
  От недостатков витаминов, наверное. Все мои витамины этот алчного негодяя забрал! Я его
  сделаю, чтоб не скучно было, чтоб Что можно было поиграть? Положил внутрь него морковка
  и сделал так, что если играет четыре морковка, он даёт тебе выигрыш. А он, э-э, подожди,
  какой выигрыш? Морковка! А как тут понять, сыграло четыре морковки или нет? Чтобы играть,
  нужно положить что-нибудь своё.


  Если на табло выпадет четыре морковка, он даст тебе морковка. Если нет, он заберёт то, что
  ты ему положить. Ага, понятно.


  Наша морковка в игре! Крош, зачем нам морковка этой железяки, если у нас своих целая тачка?
  Будет ещё одна? Плохо, что ли?


  Что это значит? Проиграл.


  Ёжик, дай-ка ещё одну морковку! А может, не надо? Он съел у меня десять морковка, 3 кг столярных
  клей и совсем новые плоскогубцы Нашу морковку надо отыграть обратно Пиу-п Я смотрю, вы сегодня
  не очень-то весёлые.


  Появилось серьёзное отношение к жизни.


  Автомат.


  Какой автомат морковный.


  Бараш! А ты не знаешь, где мой зачок?


  Я его проиграл игральному автомату. Но ты не беспокойся, я сейчас кое-что принесу и быстро
  всё отыграю! Мне сегодня так не везло в любви, что в игре повезёт обязательно!


  Я разрежу тебя на гвозди, проклятая консервная банка! Отдай мне мои рукописи, они принадлежат
  потомкам Спокойно? Я, кажется, придумал систему, по которой мы сможем выиграть. Мы будем
  играть на повышение ставок. Это значит, что мы после каждого проигрыша будем повышать ставку.
  Ну а когда выиграем, то выиграем не какую-то там морковку, а выиграем всё!


  Номен и патри этфилиту Санкти.


  Какого урок И всё А лес?


  Я порву тебя, как старую газету! Шулер, со мной такие фокусы не проходят! Отпустите меня!
  Отпустите! Мне терять больше нечего! А можно его разобрать и вернуть наши вещи обратно?
  Найм! Я предусмотрел, чтобы играть только Только честно, и поэтому сделал его неразбираемым
  и непробиваемым.


  Ёлки-палки! Мы опять выиграли!


  Давайте лучше эту несчастную морковку съедим Ёлки Ну вот Уже поздно.


  Разве.


  Морковка.'
