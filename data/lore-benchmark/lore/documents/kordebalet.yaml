id: kordebalet
title: Кордебалет
text: 'На носу праздники. Надо как-то к ним подготовиться, что ли? И чтоб не было, как в прошлый
  раз. Какие есть предложения?


  А давайте выучим какой-нибудь кардиобалет. Будет очень весело! Карди... Что?


  Ну, это танец, когда все вместе танцуют! Хмм, а что, замечательная идея! Сегодня же и начнём
  учить. Сегодня у меня день расписан по минутам. А вот завтра давайте начнём. Ой.


  — Завтра последний день цветёт календула!— Я буду собирать с утра до ночи!— Должны быть
  сразу все, а то не получится!— Хорошо, хорошо. Давайте назначим ответственного, и он нас
  соберёт, когда всем будет удобно. Пусть ответственным будет, например Ёжик! Вот и замечательно
  А сейчас, извините, мне пора.


  А что я должен делать? Собрать, пересчитать, организовать! Тебя выбрали начальником кардиобалета!


  Я пришёл узнать, когда тебе будет удобно начать учить кардиобалет. Да-да-да. Так. Завтра
  у меня экзерсисы, в среду солярий. В пятницу тоже не могу. Давай-ка, дружочек, попробуем
  на следующей неделе.


  На следующей неделе, может смогу, а может, не смогу. Завтра. Нет, что вы. Давайте во вторник.
  В среду натюри. Пока не решил. В четверг или в пятницу вряд ли получится. Много работы.
  Я занят.


  Нет Ну что?


  Когда?


  Ах, наверное, никогда. То у одного дела, то у другого. Ёжик! Скоро праздники. И если мы
  не выучим этот кардиобалет, то винить в этом будут все тебя!


  Почему ты нас, Ёжик, не смог организовать? Мы на тебя понадеялись, а ты... Ну, не могу же
  я их заставить бросить все дела. Можешь Обязан! Ты же начальник Кардиобалета! Тебя все слушаются!
  А если хоть кто-то вдруг делает что-то не так, ты записывай в книжечку и говори, что накажешь!


  А как я буду наказывать?


  Ты главное в книжечку запиши. А там придумаем как.


  Доброе утро! Через пять минут всех жду на первое занятие кардиобалета! Что опять? Урок не
  миновать.


  Вы что, совсем что ли?


  — Такую рань...— Я Ёжик, не сердись, только не сердись. Я сейчас всё урегулирую.— Ты зачем
  его провоцируешь? Хочешь, чтобы он тебя в книжечку записал?— Меня! Вы что? Хотите, чтобы
  он вас всех записал? Тут такое начнётся! Хотите?


  Нет! Тогда стройся.


  Равняйся! Смирно!


  Можно начинать.


  Начали! Раз-два, раз-два! Чётче шаг! Раз-раз! И вот так! Ножку выше! Раз-два, раз-два! Веселее!


  Вот он взял книжечку кого-то накажут.


  Разговорчики! Держать строй ножку выше! И-и-и весело!


  Папа.


  Весело! Давайте, улыбаемся.


  Здорово! Ура!


  Вы чего? Спокойно!


  Можно их отпустить? На сегодня достаточно!


  Свободны!


  Не хочу быть начальником! Ёжик! Тебя же попросили! Потерпи до праздника.


  Ура!


  А ты чего в стороне, а? Пойдём ко всем, а? Мне кажется, что я никогда больше не смогу быть
  прежним Ёжиком. Меня теперь всегда будут выбирать начальником и веселиться без меня. Да
  не переживай. Вот увидишь, скоро ты снова будешь тихим, милым, недотёпой.


  Никогда мне им уже не быть. Этот кардиобалет мне всю жизнь испортил. Всё будет хорошо! Нет!
  Да! Крош. Если ты будешь со мной спорить, я тебя запишу.'
