id: kak_sobrat_druzey_po_bystromu
title: Как собрать друзей по-быстрому
text: 'Когда никто не оказывает знаков внимания.


  День тянется медленно.


  И главное, бесполезно.


  С ума сойти? Прошло полдня, и никто не может додуматься проведать меня.


  Спросить, как у тебя настроение?


  Да так себе.


  А как здоровье?


  Это просто средство какое-то Серьёзная вещь. А что она делает? Измеряет скорость. Вот смотри.


  Скорость дерева— 0 км/ч. А почему? Почему? Потому что дерево стоит на месте. Понятно.


  А вот теперь ты иди ко мне.


  Смотри, ты шёл со скоростью беспечного Ёжика. Дай. Теперь я! Ха-ха! Ты получишь скорость
  сверхзвукового кролика! Измеряй! Ну, что ты стоишь? Давай, измеряй! Только прицелься получше,
  получше прицелься, а то ведь промахнёшься ведь!


  И запла!


  Ну вы совсем.


  Нюша, всё нормально? Или нет? Конечно, нет! Вы меня чуть не убили!


  Ах, кажется, мне плохо.


  Держите меня! Я падаю!


  — Если что-то со здоровьем, лучше сразу идти к Совунье.— Я не могу ходить. Я же больна!
  Если гости не идут к тебе Значит, ты идёшь к ним или едешь.


  Как кому нравится?


  Привет, Копатыч! Как дела? А я вот видишь, заболела. Одна надежда на сову. Как думаешь,
  поможет? Ты вечером сходи, вдруг мне лучше будет.


  Эй! Э-э-й! Бараш! Бараш, представляешь, я заболела! Но ты не бойся, это не заразная болезнь.
  Так что приходи, а как мне разговаривать мне запретили.


  Если мы будем ехать так медленно, то всюду опоздаем! Как ты думаешь, с какой скоростью мы
  едем?


  Со скоростью маленьких вьючных животных. Раз, и два, И раз, и два, И раза, И раз.


  И раз, и два! Скорая помощь приехала!


  Не-не-не-не-не-не-не-не-ню Нюша, ты заболела?


  Честно говоря, я не то чтобы заболела. Просто появилась возможность покататься на кроватке.
  Ну и грех было не воспользоваться.


  Ёжик, я не понял. Нас что, использовали? Это же так романтично кататься на кровати! Ой-ой!
  А я куда-то еду! Попутного ветра! Ёжик!


  Вези меня.


  Останови меня! Я не хочу больше кататься!


  Остановите, пожалуйста! Я слезу Потрясающая скорость для Нюшиной кровати!


  А что это было? Нюша, это как-то связано с твоей болезнью?


  Да не болею я. Просто заехала за вами, чтобы пригласить к себе в гости. Да-а, в следующий
  раз за мной заезжать не надо. Я, честное слово, лучше сам приду. Ого, ой, чаёк мне тоже
  чашечку налейте.


  Собирать гостей Большая наука. Одного радушия порой маловато, требуется выдумка и недюжинная
  смелость. Как думаешь?


  А с какой скоростью качается Совунья?'
