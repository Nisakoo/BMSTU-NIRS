id: kuda_ukhodit_staryy_god
title: Куда уходит Старый год?
text: 'Новый год Особо приятно встречать с друзьями.


  Ёжик решил пойти к кролику Крошу, чтобы встретить его, ну, так сказать, сообща. Ну и, конечно,
  он надеялся, что к ним обязательно кто-нибудь заглянет на огонёк.


  Это я, Ёжик пришёл встречать Новый год! Ты не мог бы немного подождать? Я сейчас не могу
  открыть дверь. Хорошо.


  О! Ёжик! Ты чего здесь стоишь?


  Крош просил подождать. По-моему, он занят чем-то очень важным. Чем это важным?


  Скоро Новый год!


  — Крош! Немедленно открывай!— Я не могу. Если я открою дверь, то в неё может уйти старый
  год. А мне в старом году ещё нужно успеть кое-что доделать.— Но ты хоть маленькую щёлочку
  открой! Мы войдём и никого не выпустим!— Хорошо. Только быстро.


  Ну вот! Я же говорил, что он улизнёт Не переживай! Мы его задержим! Стой! Стой! Минуточку!
  Дедушка, постойте! Здравствуйте, дядь! Мы его держим!


  Так дети быстро слезь с меня.


  Ой! Это Кар-Карыч!


  — Ложная тревога!— А мы думали, что вы Старый Год.— Спасибо, что не старый пень. Не сиди
  на снегу.— Значит, вы хотите задержать Старый Год?— Угу.


  Кто ж так задерживает?


  Будем задерживать по инструкции! Нюша следит за дверью и окнами. Лосяш сторожит калитку,
  Ёжик патрулирует двор. А я осуществляю художественное руководство: всех впускать, никого
  не выпускать. Двенадцать месяцев подряд ушли за поворот. И вот И вот за ними по пятам ходит
  старый год. Уж неприятель на посту, не стой, разинув рот. Смотри по снежному листу уже уходит
  старый год.


  Куда уходит старый год?


  Ах, какие молодцы! Поют песни на свежем воздухе! Ах, какая ёлочка! Сейчас мы её украсим!
  Теперь можно встречать Новый год.


  — Мы не можем встречать Новый год!— Мы должны сторожить старый.— Пусть сторожится другое!
  А мы будем справлять Новый год!— И где мы найдём такого простачка?


  Мы его следим из Феноменально деланных и три мешка хлопот, Но всё равно уже с утра уходит
  старый дом, А вдруг его мы невскочай обидели не бат. Проститься с нами, позабыв Уже уходит
  старый год.


  Куда уходит старый год? Куда уходит старый год с тобой Старый год — Успел?— Пока нет.— Вырости
  на 10 см.— Вырос всего на 5. В списке 102 недоделанных дела.— Но их же можно доделать в
  новом году!— А старый так и уйдёт недоделанным.


  Слышите?


  Старый год уходит. Жаль, жаль, но нельзя уговорить.


  Хоть сразу Свой замедлить ход.


  Невозможно повторить одна.


  Уходящий год Где ты, самый счастливый, самый белый, самый, новый. Здравствуй, самый счастливый,
  самый-самый.


  Здравствуйте Новый год с Новым годом! С новым счастьем! С новым списком'
