id: plyus_sneg_minus_elka
title: Плюс снег, минус елка
text: 'Ой.


  А почему мы в лесу не можем подобрать себе ёлку? Зачем нам в горы за ней тащиться? Посмотри
  вокруг! Ничего странного не замечаешь? Ну, снега нет. Вот! На носу Новый год, а снегом и
  не пахло.


  Ёлка тут причём? Почему мы идём в горы?


  В лесу снега ноль, и ёлки там не новогодние. Мы их начнём наряжать, у них от неожиданности
  иголки посыпятся. А в горах куча снега. И ёлки там к Новому году уже морально готовые. Ой.


  Если особо не приглядываться, то есть ощущение, что снежком припорошило, правда? Ну вот,
  уже зимой снегу не допроси. Это ненормально. Меня эта аномалия тоже тревожит не по-детски.


  Вы куда? В горы! За ёлки! В горы? О, принесите немножко снега. Вот ещё. У нас руки будут
  заняты. Ну хотя бы чуть-чуть. Ничего обещать не можем.


  Может, мы все сошли с ума одновременно? И сейчас вовсе не зима, а какая-нибудь весна! Или
  просто лето такое холодное.


  А мы наивные решили Новый год справить. Нет, ну какая весна? Весной ручьи, соловьи, грёзы
  любви.


  Ни по одному пункту не совпадает.


  — Вы куда?— В горы за ёлкой. Принесите немного снега.— Вот ещё! У нас руки будут заняты!—
  Ну хотя бы чуть-чуть, а?— Ничего обещать не можем.


  Наш мой гениальный машин! Это же снег! Какой же мягкий, такой же первый! Ай!


  Ты такой же скользкий.


  — Вы куда?— В горы за ёлкой!— Принесите немного снега.— Вот и ещё.— У нас руки будут заняты.—
  Ну хотя бы чуть-чуть ничего обещать не можем можем.


  Это маленькая вовсе не маленькая Ну, давай тогда эту.


  Это тоже маленькая. Ты хочешь баобаб что ли найти? Ёлка своим размером должна компенсировать
  отсутствие снега.


  Как ёлка может компенсировать отсутствие снега?


  Новый год— это снег. Плюс ёлка, плюс подарки. Снег у нас равен нулю. Чтобы этот ноль компенсировать,
  нужно, чтобы величина другого слагаемого ёлки стремилась к бесконечности!


  А почему бы нам отсутствие снега не компенсировать бесконечным обилием подарков?


  Ах, об этом раньше надо было думать. Сейчас мы уже не успеем. Остаётся только ёлка.


  Мы это не утащим. Глаза боятся. Тьфу, тьфу! Руки делают Что это было? Снег где-то сошёл.


  Фу! Ребята, снега просили принести совсем немножко. Фу.


  Поздравляю! Наша ёлка равна нулю. Снег компенсирует. Ёлки-иголки.'
source: Плюс_снег_минус_елка.txt
