id: tryufel
title: Трюфель
text: 'Это ещё что-е-е?


  Феноменально! Вот это удача! Нет, я не могу ошибиться! Это восхитительная амбре, мне не
  забыть никогда! Это же трюфель! Чего? Редкостный Деликатес! Хоть раз в жизни это обязательно
  нужно попробовать. Зови всех Такс, будем делить на девять.


  Ну-с! Ну это же совсем мало получается! Это же никаким образом не распробовать! Ну хоть
  что-то. А какие ещё есть предложения? Давайте выберем кого-нибудь одного. Пусть он всё съест,
  распробует как следует, а потом расскажет другим! Ой!


  И как же мы его выберем?


  Очень просто. Разыграем лотерею.


  Интересно, кто же станет? Итак, право вкусить и распробовать сей редкий деликатес! Получаем!


  — Крош!— Подождите!— Подождите! Это неправильно! Крош всеяден и не может связать даже двух
  слов! Как он сможет прочувствовать тонкий вкус этого трюфеля да ещё и передать его нам словами?


  Здесь нужна тонко чувствующая натура! Предлагаю себя! Да! Видишь, чего захотела? А я-я-я
  предлагаю Ёжика.


  Ну что ж Давайте выбирать.


  Ёжик самый умный! Ёжик-самый круглый! Ёжик-самый добрый! Ёжик самый-самый Ёжик самый скромный!
  Вы, наверное, думаете, что это трудно выбирать между мной и Ёжиком.


  Сейчас я вам докажу, что это сделать очень даже легко!


  Вот это я А вот это он?


  Это снова я. А вот это снова он.


  Это я! Это он. Это я! Это он! Я!


  Ой Видите, как всё ясно и просто? Не знал! Теперь понятно, кому мы можем доверить кушать
  трюфели, а кому не мой! Лучше трюфеля нет.


  Не боимся ножика! Выбираем Ёжика.


  А значит так.


  Значит так Тогда и мы так.


  Вот! Вот и вот так!


  О!


  О! Ой, хватит! Давайте голосовать!


  Кто за то, чтобы трюфель пробовала Нюша? А, а четыре.


  Кто за то, чтобы пробовал Ёжик?


  Раз, два, три, четыре.


  Пять.


  Побеждает Ёжик! Отлично! Молодца! Нет!


  Это несправедливо! Всё было подстроено! И как же, по-твоему, справедливо? Вот так! Стой!


  Ну, как оно?


  Тьфу! Тьфу-тьфу-тьфу! Какая гадость! Офф.


  Хм, да. Минуточку. Это же не трюфель! Это какое-то неизвестное ископаемое! Давайте кого-нибудь
  выберем, он это съест, а мы посмотрим, что с ним потом будет. Куда же вы, господа? Куда?
  Нужны тонко Чувствующие и красноречивые натуры'
