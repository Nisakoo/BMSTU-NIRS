id: energiya_khrapa
title: Энергия храпа
text: 'Как приятно делать субботнюю уборку не одному, а с друзьями, особенно если уборка не
  делалась в прошлую субботу. И в позапрошлую. Да и что говорить, и в позапозапрошлую тоже.


  Слушай, сколько у тебя ненужных вещей! Это всё нужное.


  — Это нужно?— Конечно.


  Понятно?


  А вот это Обязательно.


  Ух ты!


  Чего там такое? Что там такое?


  Чего нашёл?


  Давай засветим! У тебя есть электричество? Чего нет?


  Кого нет?


  Побежали к Пину! У него оно точно есть!


  Ой.


  — Ух ты!— Ой, что это?— Так, пустячок. Вечный двигатель потребляет дрова, превращает их
  в энергию и, пожалуйста, может снова потреблять дрова.


  А электричество оно даёт? Ничего не даёт, только берёт. А зачем тебе электричество?


  Вот.


  Оу, замечательный экземпляр! Айн момент.


  Ветер энергию эту превращает в электрическую энергию. Ветер дует, лопасти крутятся, лампочка
  горит.


  Ничего у тебя не горит! Ветер не дует. Лопасти не крутятся. Лампочка не горит. Ха!


  А может, без ветра обойдёмся?


  А мент.


  Нет, лучше с ветром.


  — А где ветер-то?— А, ушёл! Не волнуйтесь, Земля круглая, когда-нибудь вернётся.— Мой короче!
  За коротко.


  Придумал! Мы прокопаем дыру насквозь Земли, и ветер вернётся по этой дыре обратно!


  А вы что тут делаете? Мы копаем дыру, чтобы когда ветер был на той стороне Земли, он был
  и здесь.


  Вы что, с ума сошли? Здесь же будет жуткий сквозняк! Это вредно для организма! Немедленно
  вылезайте! Совунья, будь другом, не мешай!


  Подвергать здоровью опасности не позволю А ветер ты вызывать умеешь?


  Не знаю, надо попробовать.


  Солнечная батарейка добывает электричество не из ветер, а из солнца. Плохой механик. Лампочки
  должны гореть, когда темно, а не когда светит солнце. Надо использовать какой-нибудь ночной
  источник энергии. Ночью все должны спать. Хм.


  Может, все и должны, но не все могут. Особенно когда рядом с вашим домиком берлога, так
  сказать, Копатыча.


  Этот медведь так храпит, что у меня стены шатаются. Компрессия! Это же мощный источник энергии!


  Гори компрессор работает тихо.


  Что такое? Что за свет? Лопаты! Свист, свист!


  Не знаю, как у вас.


  А у нас уборка целое приключение.


  Стоит только начать и потом уже не остановиться.'
