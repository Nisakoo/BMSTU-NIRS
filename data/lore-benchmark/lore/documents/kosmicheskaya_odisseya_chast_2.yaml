id: kosmicheskaya_odisseya_chast_2
title: Космическая одиссея. Часть 2
text: 'Пин встревожен молчанием своего любимого творения Биби, улетевшего на Луну. Он отправляется
  на поиски Биби. Уже в космосе Пин обнаруживает нежданных пассажиров. Экспедиция сорвана.
  Но это только начало неприятностей! Держитесь!


  Пин! Пин! Очнись.


  Надо форточку открыть.


  А подышать нечем.


  Нет.


  Бортовой компьютер. Неисправность двигателя. Неисправность двигателя.


  Двигатель пробит. Неисправность двигателя. Мы не сможем вернуть обратно связь прав двигателей
  и незапланированная нагрузкой— катастрофа.


  Бортовой компьютер. Включите сигнал SOS.


  Если никто не услышит наш сигнал о помощи, нам конец.


  А починить двигатель никак нельзя?


  Бортовой компьютер открыть аварийный люк.


  Я не могу открыть, чтобы принять дополнительный курс.


  Алло, барышня, откройте люк! Ну, пожалуйста. Я не могу открыть люк. Вас и так слишком много.
  Открой люк, железка! У него кислород кончается!


  Ну-ка тихо, не жалеть. Я же сказала, незапланированная нагрузка.


  Давай.


  Мяу.


  Блин!


  Пожалуйста, я вас очень прошу, включите двигатель.


  Не знаю.


  Включи двигатель, я сказал!


  Ёжик, у тебя получилось! Только не отпускай! Держи! Держу! Как ты это сделал? Не знаю. Рули.
  Рулю.


  Давай.


  Какие иголки! Это же! Это же Биби!


  Где я? С нами? Тебя спас Биби! Он прилетел на твой сигнал SOS и всех нас спас. Биби? С ним
  всё в порядке. Где он? Да всё хорошо. Вот новое фото на память сделали.


  Биби, мой Биби, это мой сынок Биби! У него сейчас созвездие этого Каденаха, Козерога. Срочные
  дела. Оттуда связь плохая. Сказал, как управится, сразу прилетит. А мы сейчас где? Домой
  летим.


  Земля в иллюминаторе! Земля в иллюминаторе!


  Пристегните ремни и приготовьтесь к посадке. Пристегнулись уже. Пристегните ремни.


  Консервная банка.


  А почему так темно? А ты ведро своё сними! Уже снял. А, ну так здесь это ночь уже. А-а.
  А я думаю, что мне так спать хочется. Спокойной ночи. Спокойной ночи.'
source: Космическая_одиссея._Часть_2.txt
