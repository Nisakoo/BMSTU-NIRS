id: nekulturnyy
title: Некультурный
text: 'Циклон, пришедший из Африки, принесёт с собой облачность и небольшие дожди, что, впрочем,
  только обрадует садоводников и огро-, простите, садородов и ог Нет. Огородников и садоводов.
  О боже мой, ну и скольнул.


  В остальных областях предельно ясно и, конечно, солнечно. Да что такое? И солнечно, конечно.


  И, конечно, солнечно.


  Значит, профессор, вы считаете, что урожай с огорода будет более витаминизированный и минерализованный,
  если огородить посаженную культуру от этих маленьких вездесущих сорняков? Что такое? Э-э,
  брат, у меня здесь огород, а не клумба. Совершенно верно.


  Наверное. Что такое сорняк? Буду.


  Растение дикое, некультурное во всех отношениях. Ах, профессор, как это вы точно сказали!
  Вот теперь красота.


  Ёжик, если бы тебе предложили на выбор немного морковки или хорошее настроение на оставшееся
  лето, ты бы что выбрал?


  — Конечно, хорошее настроение.— Так и запишем: Ёжик отказался от своей части урожая морковки.
  А если бы предложили немного яблочек или яблочек? И много.


  О!


  — Копатыч!— Ты чего это всё цветами засадил? Что мы есть-то будем?— Это не я, честное слово.
  Это сорняк! Всю культуру поел. Плющ.


  Ну, сорняк! Держись! Ты сейчас нам за культуру ответишь.


  Приступаем к силовым упражнениям. Взяли гантели в руки. Подняли, опустили. Вверх, вниз.
  Дыхание свободное. Руки лёгкие. И-и-и раз-два-три-четыре. Раз-два-раз-два-раз-два. Раз-два.
  Закончили упражнение.


  А что, если это и не сорняк, а какая-то особая культура? Вот и урожай! А если он ядовитый?


  Ой! Ой-ой-ой! Ой! Я на минутку! Побежали! Ой-ой-ой-ой-ой-ой-ой-ой-ой-ой! Ядовитый плющ.
  Продолжаем концерт по заявкам.


  Это раствор моего собственного приготовления. Для культурных растений он безвреден, а сорняки
  его ох, как не любят. А когда же ты придёшь, тогда — Копатыч! Смотри, куда прыскаешь!— Для
  культурных раствор безвреден.— Ай! Кто-нибудь, помогите!


  Вот же сорняк разросся. И чем сильнее, тем наглее. Одним словом! Некультурный. Есть мнение,
  что нам эту ядовитую громадину не победить.


  Ой! Опять! Да что ж это такое? Я скоро буду Какой здесь ветрище! Следующая песня из нашего
  сердца Они надуваются папа.


  Пусти! Пусти! Некультурный удар!


  Как Иду, ползу, лезу и поднимаюсь. Специально для дружеских контакт есть контакт В финале
  передачи это Апофис Ёжик! Готовьсь! Вы куда?! Спускаются слома.


  Поехали.


  Ну, ребята, вы попали в твой домик, твоя тачка урожай Диагональный баз на правый фланг.
  Перевок налево! Наверное стартуем!


  А семечки у этого сорняка вроде ничего, вкусные!


  Ой! Я на минутку Никуда не уходите, я сейчас!


  Ой.'
