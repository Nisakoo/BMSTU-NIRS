id: kulinariya
title: Кулинария
text: 'Э-э Еда— это не просто энергия, друг мой, циничный. Это большая культура, это философия,
  отношение к жизни. Скажи мне, что ты ешь, и я скажу, кто ты.


  А что плохого в морковке?


  В морковке ничего плохого нет. Сама по себе морковка не вредна.


  Плохо, то как ты собираешься её употребить? Ты её только что откопал и недолго думая суёшь
  в рот! Я её протёр. Ну и что? Я есть хочу! Ну и что? Я всегда так делаю.


  Это неправильно. Ты поступаешь как дикое животное. Нарыл и сразу в пасть. А ты животное
  культурное, и тебе должно быть знакомо слово кулинария.


  Во-первых, чтобы приготовить правильное блюдо, мы сначала должны правильно отобрать исходный
  материал.


  Это всем известно. Давай её просто съедим.


  Во-вторых, как правило, исходный материал требует не только помывки, но и чистки. Осторожно
  снимаем кожицу.


  Перед тем как готовить, нужно определиться, что будем готовить.


  А почему нельзя съесть просто морковь? Просто помытую и очищенную морковь? Когда блюдо состоит
  из нескольких продуктов, вкус его становится более сложным, насыщенным и непонятным.


  Продукты нельзя бездумно валить в одну кучу. Ингредиенты, так называются части будущего
  блюда, должны гармонировать, то есть хорошо сочетаться между собой.


  Например, красной моркови хорошо подойдёт жёлтый ананас, зелёный огурец, немного оранжевой
  мякоти тыквы и янтарного мёда.


  Синяя слива нам не нужна.


  В большинстве случаев продукты нужно измельчить, сделав их не только удобными для приготовления
  и дальнейшего поедания, но и загадочными на вид.


  Смотрите, как наши ингредиенты аппетитно переливаются свежим соком.


  Э-э-э, очень аппетитно! Давайте есть.


  Потом, как правило, начинается термическая обработка. Мы можем всё сварить, зажарить, затушить,
  запечь и даже припустить. Обычно это зависит от посуды, которую предоставил нам наш спонсор.


  Нам повезло. Здесь мы можем жарить, здесь варить, а здесь что-нибудь припустить.


  А теперь маленький кулинарный секретик от Лосяша.


  Если жарить на слабом огне, то жариться будет слабо. А если на сильном...


  Да сильно.


  Пока пища достигает готовности, можно пойти нагулять. Аппетит.


  Он уже давно нагулен! Давайте его в конце концов есть! Не говорите ерунду, друг мой, Копатыч.
  Нужно подышать. Да какой подышать? Ну какой кислород? Какой воздух воздухом соль кормить
  будем? Соль— это всё. Половина успеха— правильно посолить.


  Это же сахар?


  Ну неважно.


  А теперь сервировка.


  Подавать тоже нужно уметь. Блюдо должно быть не только вкусным, но аппетитно выглядеть и
  радовать глаз.


  Ты не будешь?


  Ай По-моему, чего-то не хватает. Может быть, соуса?


  Аппетиту в кулинарии не хватать может только аппетиту.


  Ты не будешь.'
