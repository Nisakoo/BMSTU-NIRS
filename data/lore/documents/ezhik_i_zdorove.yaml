id: ezhik_i_zdorove
title: Ёжик и здоровье
text: 'Бывает же, что иногда вспоминаешь про такую штуку, как собственное здоровье. Вот не
  помнил о нём, и всё было в порядке. А как вспомнил, уже и не уверен даже, есть ли оно у
  тебя, или его уже нет.


  Ты готов? Всё прихорашиваешься? Посмотри, у меня температуры нет.


  Одинаково. Может, у тебя тоже температура? Хотя вряд ли тебя чем-нибудь проймёшь. Ты и не
  болел-то никогда по-настоящему. Ты даже не представляешь, сколько вокруг опасностей для
  здоровья. Одних микробов миллиарды ползают. А есть ещё и вирусы.


  — Ты можешь быть уже смертельно болен и даже не подозревать об этом.— Что это ты вдруг о
  своём здоровье забеспокоился?— Болит что ли чего?— Если бы всё было так просто: болит в
  каком-то одном месте и сразу ясно, что надо лечить.— А у меня сразу все признаки налицо.—
  Какие ещё признаки?— Да все! Язык Температура. Так, головокружение, онемение конечностей.
  Вот тут всё время чешется. В ушах гудит сухие хрипы, помутнение роговиц, тромбофлебит. А
  ещё когда я делаю так:«Э-э», у меня там что-то щёлкает. Только не делай так.


  — Так! Легко сказать, не делай!— Как не делать, я свещён?— Я готов смириться с любым диагнозом.
  Но меня пугает неизвестность.


  Микробы! А-а! Я только что проглотил миллион микробов! Мне конец.


  Ладно, покажем тебя специалисту.


  — Температура нормальная.— Горло?— в порядке.— Здоров!— Ты уверена?— Без болезни и здоровью
  не рад.— Ты абсолютно здоров!— Это окончательный диагноз. Хоть воду вози.


  Но профилактика никогда не помешает. Чисти зубы, избегай сквозняков, делай уборку, мой фрукты,
  овощи, руки. Угу.


  Потому что в самолёте всё зависит от винта.


  Прикрой дверь! Сквозит же.


  Ничего не понимаю. Я мою руки уже полчаса. А такое ощущение, что они ещё грязные. Э-э-э!
  Тебе мыло не жалко? На здоровье не экономят. Ёжик! Замри. Возьми в углу бахилы. У меня здесь
  всё продезинфицировано.


  Профилактика от микробов. А как ты со мной здороваться будешь? Руку-то пожмёшь Я думаю,
  если хорошо протереть твою руку зеленкой, то, возможно, большинство микробов на ней дезинфицируется.
  Удивительно.


  Как ты раньше её выжимал и до сих пор в живых остался? Что с тобой, Ёжик?


  Ты понимаешь? Раньше я совершенно халатно относился к своему здоровью.


  Можно сказать, преступно. О-о, страшно подумать, сколько раз я рисковал без всякого повода,
  вступая в контакт с враждебной окружающей средой! Ёжик! А зачем тебе такое здоровье? Ну,
  как зачем? Смешной такой, чтобы жить!


  А если ты захочешь обнять кого-то, ты будешь его зелёнкой обмазывать? Что-нибудь придумаю.


  Ужас! В воздухе тучи пыли.


  Да ты вообще что ли никого, кроме микробов, не замечаешь?


  Ну раз так! Ну и живи с ней!


  Ёжик, пойдём поиграем. А ракетку и шарик можешь вымазать зеленкой?


  Привет, Крош! Смотри, что я придумал! А ты боялся? Теперь я могу с тобой здороваться. Что
  случилось? Почему ставни? Понимаешь, мне кажется, что мой организм плохо реагирует на солнце.
  Глаза болят и пятно какое-то на руке.


  — Нет тут никакого пятна! Ты себе всё придумываешь!— Как же нет?— Как же нет? Как же, а
  как же нет? Я же своими глазами видел!— Есть!— Ага! У тебя просто глаз ещё не намётан.


  Как же ты теперь будешь? Единое пятно без меня. Без... Я же своими глазами. Без свежего
  воздуха! Но ведь здоровье— это самое главное! Что там ещё?


  Через две недели снимут гипс, и будешь бегать быстрее прежнего!


  Крошень. Идите чай пить.


  Что такое?


  А руки мыть кто будет? Доказано.


  Так что того, что моешь руки, здоровье при неожиданном падении никто не гарантирует. Везде
  солома? Не подстелишь. Ничего не знаю. Живо мыть руки!


  Оба-на! У меня ещё и все признаки старческого маразма!'
