id: lili
title: Лили
text: 'Ну, как клёв? Поймал что-нибудь? Пока вроде это нет.


  Туда-сюда, водила! А потом как выпрыгнет? Вот такая вот рыбина! Гимбанам! Без обмана! Я
  уже сачок приготовил, а она сорвалась. Ты о чём думаешь? Я ни о чём.


  Странный ты какой-то сегодня. На солнце что ли перегрелся? Пойдём, я тебе холодного морса
  дам. Я лучше потом. Потом.


  Не рыба, а зверь! Я её и так! И так! А она ни в какую!


  Ёжик.


  Ёжик! Ёжик! Ёжик! Ёжик!


  Мас!


  Что читаешь? Оба-на!


  Может, ты заболел?


  У меня из головы всё не идёт эта лили. Мне кажется, в этой истории есть какая-то тайна.


  Угу. Значит, ты нашёл её здесь.


  Понятно. Что понятно? Изображение приплыло со стороны моря. Это значит, что оно как-то туда
  попало.


  Версия первая. Кто-то плыл на корабле, возможно, от этой самой Лили и выкинул её портрет,
  чтобы эту самую Лили забыть навсегда.


  Тогда бы он портрет сначала порвал. Хм, логично. Версия вторая. Лили плыла на корабле. Был
  шторм, корабль качало. Лилия вышла на палубу и тут а-а Помогите, помогите! Возможно, что
  и сама Мадмуазель Лили оказалась в воде.


  Ёжик.


  Ёжик! Ты куда? Надо что-то делать! Нельзя терять ни минуты! Лили может быть в опасности
  Ёжик! Ну куда ты собрался? Как же ты будешь спасать Лили, если не знаешь, где она находится?
  Я чувствую, у нас с ней возникла духовная связь.


  — Какая связь?— Ты же её вживую никогда не видел!— Ну и что?— Знаешь, что я понял?— Что?—
  Она уронила свой портрет неслучайно. Она оказалась в воде, но смогла доплыть до необитаемого
  острова. Видишь эти пальмы? Она нарисовала их, чтобы я мог найти по ним По ним этот остров
  и спасти её.


  Ёжик, я тебя никуда не пущу! Шторм начинается! Я не хочу тебя потерять из-за какой-то там
  Лили! Как ты можешь так говорить? Она сидит там одна, переживает, думает, дошёл ли мой портрет
  на Ёжика, спасёт ли он меня? Может, её уже спасли без тебя?


  Тебя! А если нет, и кто её может спасти, если никто, кроме нас не знает, что произошло с
  ними на самом деле? Я тебя не пущу.


  Ты слышал? Кто-то кричал! Да это я кричу тут уже два часа А! Ёжик! Разрешите представить
  тебе Мадмуазель Лист Лимонад летний'
