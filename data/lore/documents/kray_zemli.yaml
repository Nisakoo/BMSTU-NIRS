id: kray_zemli
title: Край земли
text: 'И таким образом получаем немыслимое равенство второй космической скорости и скорости
  твоего прыжка.


  А это уж простите, полнейшее недоразумение. Солнышко, солнышко. То есть допрыгнуть до солнца?
  Не получится. Ну, разумеется. Солнышко, солнышко... А это моё. Нечего. Это так же очевидно.


  Так и то, что наша Земля круглая.


  Лосяш! Погоди! Неужели ты действительно веришь в том, что Земля круглая? В общем-то, сомневаться
  не приходится скажешь тоже круглая Земля.


  Вот Так вот! На самом деле, всем давно известно, что Земля плоская и лежит на трёх слонах,
  а те, в свою очередь, стоят на большой черепахе. Феноменально! Друг мой, вы себе даже не
  представляете насколько вы, мягко говоря, заблуждаетесь.


  Заблуждаетесь! Представить себе, я могу всё, что угодно Нет уж, позвольте, в этом споре
  рано ставить точку.


  Вот! Что это по-вашему?


  Разноцветный шарик! На Нюшу смахивает, когда она с косметикой перебарщивает. Так вот, неандерталец
  вы мой прыгучий. Это глобус, не что иное, как модель нашей планеты! Это не доказывает, что
  Земля круглая, мало ли кто глобус сляпал.


  — То есть вы мне не верите?— Хорошо.— А что вы на это скажете, сомневающийся вы мой? Фотография,
  между прочим, сделана со спутника!— Конечно, тут ничего не видно. Всё же снизу. Хотя вон
  черепашьи лапы торчат!— Перестаньте паясничать! Земля Земля круглая! Это доказано сотни
  лет назад!


  Ты сам-то в это веришь? Почему же тогда с обратной стороны ничего не падает?


  О! Что и требовалось доказать?


  На Земле всё удерживает гравитация.


  — Вот, видите?— Слишком сложно, чтобы быть правдой. Вот с черепахой тут всё ясно. Вы не
  можете отрицать очевидное! Джордано Бруно отдал жизнь ради этой истины!— Ну, это уж совсем
  не доказательство.


  В общем, заблуждение. Штука опасная.


  Ёжик! Ты чего? Неужели ты тоже думаешь, что Земля круглая? Я-я как-то раньше не придавал
  этому значения.


  Мне вот иногда кажется, что наш мир кем-то нарисован и за нами всё время кто-то наблюдает.


  Вон оттуда.


  Ну ты даёшь! Нарисован! Я вот тут подумал: если я единственный, кто знает правду, значит,
  я единственный, кто сможет её доказать! Думаешь, это возможно?


  Надо просто добраться до края Земли и сфотографировать черепаху.


  Ну, счастливо оставаться! Я только туда и обратно. К ужину вернусь.


  Подожди! Тебе нужны свидетели? Всё-таки ответственная экспедиция. Эх, ежидзе, с тобой хоть
  на край света.


  И тут я такой:«Кладу перед ним фотографии:"Мол, что я говорил?" Черепаха! Черепаха!» А он
  посмотрит и скажет:«Феноменально».


  А-а. А если не будет никакой черепахи Всё, хватит! Давай признаем, что ничего не вышло.
  Пора возвращаться.


  Ёжик, мы уже почти доплыли! Обидно возвращаться, когда до края Земли осталось всего ничего.
  А ты не подумал, что Лосяш может быть прав? И что у Земли нет края? Нет!


  Земля не может быть круглой! Ты только представь, ни слонов, ни черепахи, один глупый шар,
  который болтается в космосе. Так не может быть! Потому что это неинтересно!


  Ёжик! Ёжик! Ёжик! Просыпайся же! Мы нашли его! Кого? Его край земли усиливается! Фотоаппарат,
  скорее! Только не сейчас! Как бы нам не свалиться!


  Ёжик.


  Ты видишь это Ёлки-иголки! Теперь нам точно никто не поверит.'
