id: kto_pervyy
title: Кто первый?
text: 'Однажды Нюша и Бараш договорились встретиться в лесу около самой высокой сосны ровно
  в 9:00 утра. Зачем?— спросите вы. Об этом мы сейчас узнаем.


  Ну вот. Как всегда. Опять я пришла первой пунктуально, до неприличия. А ведь девушки всегда
  должны опаздывать.


  Ну всё! Хватит.


  — Ты!— Ты! Как ты мог?— Я-я ничего не делал.— Вот именно Ты ничего не делал.


  Ты просто не пришёл — Спишь что ли?— Да, сплю.— Мы договорились встретиться в 9:00.— Правильно!
  Без двадцати пяти десять уже!— Всё проспал!


  Ясно, глупенькая. Ещё и обзывается! Нюша, у тебя просто часы на час назад. Можно подумать,
  мы с тобой в разных часовых поясах живём. Нет, ты часы забыла перевести. Сейчас летнее время,
  поэтому пришла на час раньше.


  Ну и ты главное, что я прав.


  Бараш, у тебя, кажется, был молоток. Давай его сюда.


  А почему ты не спрашиваешь, зачем нам молоток? Раз спрашиваешь, значит, вам нужен Бараш.
  Что-то случилось.


  Нет. Что-то всё-таки случилось. Расскажи.


  Мы С Нюшей поссорились.


  А кто виноват? Ну, конечно же, не я. А ты пойди и помирись с ней. Нет! Я на неё обиделся.
  Она часы не перевела, а мне говорит, что я проспал. Ну и что? Всё равно помирись, так сказать,
  первым. Нет, нет, нет, нет. Надо быть мужчиной! Да. Тем более Тем более что она не права,
  а я прав. Она на меня ни за что ни про что накричала. Сама придёт. Он прав. Она первая должна
  прийти, раз она виновата.


  — Вот, помню, был случай...— Ну почему же он не идёт?— А ты не жди, иди сама.— Сама?— Первый?—
  Ну уж нет.


  Но ведь это же ты перепутала время! Да, я ошиблась. Но я не виновата!


  А он меня ещё и оскорбил. Глупый обозвал! Да. Глупый, это уж слишком.


  А у Ёжика крыша протекает.


  Мы хотели её залатать!


  Что-то надо делать.


  Я уже чувствую себя таким виноватым.


  Придумал. Ты подари ей подарок, что-то, так сказать, оригинальное. Правильно! Из пеки.


  — Но я ведь ни разу не делал торт.— Это неважно. У Нюши в поваренной книге я видел, так
  сказать, рецепт, как сделать замок из песочного теста.


  Это Бараш! Он пришёл извиняться.


  Это вы? Мы это нам надо поваренную книгу. Поваренную книгу? А зачем вам? Нам надо просто
  Так сказать, у меня крыша продырявилась. Да, надо её отремонтировать. А причём тут поваренная
  книга?


  Э-э, я хотел морковку засолить.


  — Держите!— Кстати, а ты сладкое любишь?— Конечно. Нюша, не переживай, всё будет хорошо.


  А вот помню ещё был случай Это опять я. Нам, то есть мне нужен сахар. Ты хочешь сказать
  соль? Ты же морковку солишь?


  Сахар всё равно нужен для вкуса. Вот.


  Забирай.


  Спасибо — И ещё нужна мешалка.— Что?— Морковку мешать?— Да, почти.


  Что же делать?


  Я ведь действительно зря на него накричала. Он ведь такой гордый!


  Пойду к нему. Мне надо его увидеть.


  Это тебе замок. Я сделал его для тебя.


  К тому же он Съедобный. Действительно съедобный. Спасибо.


  А я не знаю, что на меня нашло. Ты меня прости? Морковки солёной не хватает. Морковку солёную.'
