id: prints_dlya_nyushi
title: Принц для Нюши
text: 'Нюша третий день с перерывом на обед читала самую интересную книгу в своей жизни.


  Книга была с цветными картинками, толстая, но читать оставалось уже совсем немного, так
  немного, что, пожалуй, мы можем дочитать её вместе с Нюшей. Бесстрашный рыцарь прогнал испуганного
  дракона и улыбнулся освобождённой принцессе.


  «Когда вы рядом»,— сказала прекрасная принцесса рыцарю,—«моему сердцу так радостно, что
  оно вот-вот выпрыгнет из груди».


  Потрясающе! Вот-вот выпрыгнет из груди. Ой!


  А когда рядом вы,— сказал ей рыцарь,— меня переполняет нежное чувство, которое воодушевляет
  меня на новые подвиги. Он взял её за руку.


  И повёл во дворец.


  Как?


  Всё Как это здорово быть принцессой! Все ради тебя совершают подвиги всякие героические
  поступки. Пойду-ка я.


  Тоже воодушевлю кого-нибудь на подвиги.


  Для начала Нюша решила воодушевить Ёжика и Кроша. Они в это время ставили научные опыты,
  а в науке всегда есть место подвигам. Готово! Дать обратный отсчёт.


  Крош. Четыре. Ёжик. У меня такое чувство, как будто меня стало больше. Меня что-то переполняет.


  Смотри! Здорово! Ага. Ну вы совсем.


  — Странно, но ни Ёжик, ни Крош не смогли воодушевиться на подвиги. Может быть, для этого
  нужен особый склад души более восприимчивый. Нюша и побежала воодушевлять Бараша. Всё-таки
  Бараш был поэтом. Бараш, милый, здравствуй! Представляешь, я сегодня вдруг почувствовала,
  что моё сердце вот-вот выпрыгнет Выпрыгнуть из груди и Бараш! Бараш!


  Здравствуй, Нюша. Здравствуй ещё раз. Что с тобой, Бараш? Ничего.


  Просто я бездарность! Нет! Ты не бездарность! Не надо.


  Давайте хоть сегодня будем искренни.


  Так что у тебя там с сердцем? Да так, ничего особенного. У Совуньи есть хорошие сердечные
  капли из шишек. Я их пью, когда сильно волнуюсь.


  Иногда помогает.


  Хочешь?


  Как известно, в трудных ситуациях нужен совет. Нюша решила посоветоваться с Кар-Карычем,
  кого и на какие подвиги в конце концов она должна воодушевлять?


  Боже мой! Нюша! Что случилось?


  — Что, такая грустная книжка?— Нет, там всё замечательно. Принцесса! Все её любят, совершают
  для неё подвиги, а для меня никто не хочет совершить. Даже самый маленький подвиг. Вследствие
  этого я так одинока!— Понятно. Ну, для начала перестань.


  — Плакать!— Ты говоришь, что тебе стало одиноко, значит, ты обратилась по адресу?— Кто лучше
  старого ворона может знать, что такое одиночество? Как-то судно, на котором я плыл, потерпело
  кораблекрушение. Меня выбросило на пустынный остров, и я целый день провёл на нём в полном.


  ...полном одиночестве, пока не обнаружил, что на другой конец острова выбросило другого
  пассажира. И им оказался принц из одного королевства. Принц! Это то, что мне нужно. Мне
  нужен принц и как можно скорее! Спасибо, Кар-Карыч.


  Кар-Карыч, а где мне его взять? А у тебя случайно есть?


  Нюша обошла песчаную косу и Дюны, проверяя, не выбросило ли на берег какого-нибудь принца,
  потерпевшего кораблекрушение. Любой из нас уже бы отчаялся, но она сидела и ждала, а принца
  как назло всё не было.


  И когда Нюша всё-таки собралась идти домой — Ну прекраснейшая из прекраснейших! Я принц
  и пришёл, чтобы совершить во имя тебя подвиг!— Спасибо, лучше не надо. Я домой пойду.— Это
  невозможно!— Почему?— Сначала подвиги.


  Ой! Мы решили сделать для тебя какой-нибудь подвиг и сделали принца! Принца?! Да я чуть
  не умерла от страха! Я тоже! Ты ещё не видела? Какого мы сделали дракона?


  Мы уж решили, что искать принца сломя голову— дело рискованное. Вдруг попадётся какой-нибудь
  беспардонный и мучайся с ним потом.


  А воодушевить на подвиги, как выяснилось, можно и Ёжика, и Кроша. И сами видели, даже Барашок.
  У нас принцесс— это запросто.'
