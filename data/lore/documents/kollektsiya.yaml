id: kollektsiya
title: Коллекция
text: 'Фантик как фантик! Ну это же просто бумажка! Ничего особенного. Не скажи, видишь эту
  синюю полоску? Такие фантики попадаются очень редко. Их сейчас не достать.


  Ну и что? Это раритет! Коллекционная редкость!


  Нет, ты объясни мне, в чём смысл собирания фантиков? Я понимаю, если бы ты собирал конфеты,
  насобирал бы целое ведро, а потом позвал бы друга и накормил его. Но фантики. Ёжик! И что?
  Может, над тобой кто-то просто пошутил?


  Кто-то решил тебя разыграть и сказал, что собирать фантики— это круто.


  Никто ничего мне не говорил.


  Тогда зачем ты собираешь то, что другие обычно выкидывают?


  — В чём ценность фантиков?— Есть какая-то тайна, да?— Не знаю, может быть, есть.


  Просто сначала мне попался фантик с красной полоской, а потом зелёной. И тут мне стало интересно,
  а какие ещё бывают фантики? Я перестал их выкидывать и стал откладывать. Теперь у меня целая
  коллекция!


  Ха! Теперь я понимаю, почему ты дома не убираешься. Ты решил здесь устроить свалку? Тащишь
  с улицы всякий мусор и раскладываешь по углам. Во-первых, я убираюсь. Во-вторых, это не
  мусор.


  Это коллекция. А если ты этого не понимаешь То и не надо. Если бы это была коллекция, ты
  бы мне о ней раньше сказал. А так ты всегда знал, что это просто мусор, поэтому и не говорил.
  Я просто знал, что ты не поймёшь своей-своей... Ну, ну, договаривай!


  Своей тугодумной головой Ты и есть этот Раритет!


  Фантик! А ты риски.


  Тебе никогда не понять, что испытываешь, когда находишь фантик, который долго искал. Когда
  чувствуешь, как твоя коллекция попы пополняется.


  Да что с тобой разговаривать?


  Буря-то какая!


  Ветер так и гуляет. Туда-сюда, туда-сюда! Ой, еле до тебя дошёл! Я тут тебе кое-что принёс.


  Вообще-то, я нёс конфету. Но потом так вышло, но фантик вот Зелёной полоской.


  У меня такой есть. Но ничего, пригодится. Обменяюсь с кем-нибудь.


  Ну, ладно.


  Я — Пойду.— Может, чаю?— Разумеется!


  Буря Не волнуйся, я сейчас их все соберу. Только не волнуйся.


  Фантики.


  Крош.


  Где ты?


  Крош! Крош! Пожалуйста, найдись.


  Крош, Крошек.


  Ёжик, твои фантики— это что-то. Я за ними гнался-гнался, гнался-гнался, а они всё равно
  улетели. Я сейчас немного отдохну, и мы обязательно отыщем их. Всю твою коллекцию. Крош.


  Ты даже не представляешь, как я рад!


  — Что нашёл тебя?— Как будто нашёл редкий фантик.— Больше.


  Я так рад.


  Как чему? Как раритету?


  Ты раритет, я раритет. Выходит, мы с тобой какая-то своеобразная коллекция'
