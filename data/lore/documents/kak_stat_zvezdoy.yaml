id: kak_stat_zvezdoy
title: Как стать звездой
text: 'Зима в этом году выдалась на славу, много снега, лёгкий морозец и солнце.


  Сидеть бы где-нибудь в гостях у Кар-Карыча возле тёплого камина и листать старые журналы.
  Красота! Вот так. А мы так. Хм, пропускаем.


  Аркадь, как это, наверное, клёво быть знаменитой звездой! Печатают тебя в журналах, берут
  интервью. Ай!


  Ой, какие бы интересные интервью я давала про свою жизнь, про чужую жизнь! Ой, закачаешься!
  Я знавал много знаменитостей, звёзд первой величины, и все они страдали от своей славы.
  Ой, нашли от чего страдать. Я бы не страдала, честное слово.


  — Слово...— Но как стать знаменитым?— Наверное, нужно сделать что-нибудь особенное.— Да!
  Прежде всего нужно поразить окружающих. И тогда тебе все заговорят! Ой!


  Как же поразить этих окружающих! А-а! Новый мировой рекорд!


  Рекорд. Обид.


  — Что это?— Пока не понял.— Дурики! Это же я!— Нюша!— А чего это ты так вырядилась-то?—
  Неужели непонятно?


  На кого я похожа? На круж.


  — Молчи.— Ой, темнота! Журналы надо читать про знаменитостей. Я похожа на звезду.— Ну и
  что теперь?— Что, что? Ничего! Хотите? Интервью дам?


  — Ты же ещё не звезда!— Скоро буду!— А хочешь, мы тебе поможем?— Как Мы тебя запустим в
  космос к другим звёздам.


  Раз, два, три! Хорошо, пошла! Новый мировой рекорд!


  Ну вы вообще Кар-Карыч, мне до звезды явно чего-то, ой, не хватает. Звезду, Нюшенька делают
  её манеры.


  Ходит она вот так смотрит вот так.


  Говори.


  Вот так.


  Всё! Всё надо делать по-особенному. Пусто! Пусто!


  Понеслась!


  Ходит вот так говорит:«Вот так. Но малышня. Держись Раз! Раз, два, два, три! Звёздочка!
  Звёздочка! Гори! Лети, лети, моя звезда! Дураки мостинами! Что вы в красоте понимаете?


  Кукрико.


  — Кукареку!— Браво, браво, кут-ку-дах-тах-так-так-так!— Кукарику!— Браво!— Ничего не понимаю.—
  Кукареку!— Я вроде уж такая особенная-разособенная.— Кукореку!— Новые и признания ко мне
  всё не приходят.


  Признание приходит к таланту! Точно! Я же тебе про талант забыл сказать. Конечно, нужен
  талант! А где ж мне его взять?


  — Может, у меня и нет никакого таланта?— Так, талант есть у каждого. Нужно только его найти.


  Нюша отправилась на поиски своего таланта.


  А талант никак не находился.


  То ли он был такой маленький, что пройдёшь мимо и не заметишь, то ли прятался слишком глубоко.


  Талантов всё не было и не было ни одного намёка.


  Как вдруг?


  Браво, Нюша! Браво! Браво! Настоящий! Браво! Браво! Настоящая! Бараша звёздочка! Ничего
  себе!


  — Крош? Ты так можешь?— Не знаю, не пробовал.


  Спинку прогибаем! Носочки есть? Так уже лучше. Посадочку помягче! Хорошо. Хорошо.


  Да. Зима выдалась богатая и на снег, и на мороз, и на талант. Укуси меня, пчела. Так ведь
  ещё зима! Спать! Красота!'
