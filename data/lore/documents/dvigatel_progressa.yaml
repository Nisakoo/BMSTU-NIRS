id: dvigatel_progressa
title: Двигатель прогресса
text: 'Ну, ёлки-иголки! Опять 25! Вчера было 25, позавчера было 25, позапозавчера тоже никакого
  прогресса. А такое часто бывает. Есть прогресс, а потом п-ф-ф, аллес. Никакой прогресса.
  Все только ходят туда-сюда.


  А потом И снова пошёл прогресс! А что значит? Бац!


  А, вот! Значит, какой-нибудь великий изобретатель, который дальше двигать прогресс в науке
  и технике. Ага. А что значит?


  Значит От винта.


  Ёжик! А не кажется ли тебе, что мы остановились в своём развитии?


  Только не надо обобщать.


  Нет, правда. Я сначала думал, что это только моя проблема. А теперь совершенно ясно, что
  прогресса нет нигде. Вот, вот! Посмотри! Где-где он, прогресс? Где? Вот видишь, даже одуванчик
  не растёт. Нужен какой-то бац.


  Тихо! Я всё понял! Мы должны сделать великое изобретение! Мы сделаем такой бац, что прогресс
  полетит, как ошпаренный только пятки засверкают.


  Нам что нужно? Нам нужна идея! Для идеи что нужно? Мозг! Хе-хе. Ну, мозг есть. Лапы, крылья.
  Неважно. Руки, способные воплотить идеи мозга, тоже есть! Так что считайте, что великое
  изобретение у нас в кармане!


  Меня зачем разбудили? Э-э-э... Пока не придумал.


  Ты готовься, а я пошёл генерировать идею. Во! Я-я натёр их.


  Бац! Бац! Бац, бац, бац, бац, бац! Бац, бац, бац, бац! Бац! Бац, бац, бац! Бац! Бац!


  Бать! Бац! Бать! Бать, бац! Ну что, придумал? Не мешай. Принеси лучше кипяточку. Бац! Бац!
  Бац! Бац! Бац, пац! Бац-бац-бац!


  А что такое? Придумал! Я люблю такую штуку! Ты даже не представляешь!


  Короче, это такая... Это такой, как бы сказать... Ёлки-иголки! Короче, он... Ты в него садишься
  и там я ещё такую штуку придумал. Она крутится и как бы э-э А! Короче, я всё нарисую и принесу.


  Бац, бац, хватит, бац! Бацпать. Бац, бац, бац.


  Бац, бац, бац-бац! Бац-бат-бам! Бац, бац, бац, бац!


  Бац! Бац! Бац, бац! Пара! Бац, бац, бац, бац! Пампарам!


  А вот и не покажу! Ничего вам не покажу! Ничего-шеньки! Ха-ха! Всё! Ухожу, а чертёж и записки
  уничтожу.


  Ладно, так и быть. Покажу.


  Я пока не придумал название, но садишься сюда, крутишь вот эти педали— это руль, им поворачиваешь,
  а вот эта вот штука крутит переднее колесо, и ты едешь! Лучше заднее.


  — Да, задний и правда лучше.— Это же велосипед.— В каком смысле?— Ты изобрёл велосипед?—
  Я-я, велосипед, натюре.


  Какой ещё велосипед? Ты что, никогда не видел велосипеда? Книжки надо читать.


  Я чего-то не понимаю. Вы на что намекаете? Что это? Это уже есть!


  Никому не расходиться, прогрессу подготовиться к резкому скачку! Показываю! Новая игра!
  Тут чертим крестик, а здесь, например, нолик. Здесь крестик, а здесь крестики, нолики. Точно-точно.
  Крестики-нолики! Подожди. В каком смысле?


  Ох, я даже не знаю, чему больше удивляться: твоей изобретательности или твоей неинформированности?
  Ты что, в пещере живёшь? Старая игра. Очень старый.


  Странно. Но допустим! Но что вы скажете вот на это? Танец, который ёлки-иголки перевернёт
  этот мир, исполняет автор! Бац-бац-бац-бац! Та-тарата! Бац-бац-бац-бац! Та-тарата! Бац-бац-бац-бац!
  Та-тарата, бац! Та-тарам! Бара-бац!


  Это же танго! А в каком смысле?'
