id: snotvorets
title: Снотворец
text: 'Э-э-э. Мне сегодня снилась зима. Я катаюсь на санках. А мне снилось, что я летаю. Здорово!
  А мне никогда ничего не снится. О! Вот это да! Не везёт, так не везёт. Может, ты просто
  не помнишь?


  А чего вы спать не идёте?


  Тоже бессонница.


  Уже идём.


  Попробую считать баранов. Говорят, помогает заснуть.


  Один баран.


  Два барана.


  Три барана.


  Четыре барана.


  Сто двадцать пять баранов. Сто двадцать шесть баранов. Сто двадцать семь баранов! Ну, что
  будешь заказывать?


  — В каком смысле?— Какой сон?— Ты сейчас спишь, а я тебе снюсь.


  А что? Можно? Ага! Я-я хочу! Я хочу, чтобы мне приснилось море!


  А теперь яхта!


  А на ней?


  Принц Что-то не так?


  Да нет, всё нормально.


  Такой пойдёт.


  Да! По мне. Спасибо, Бараш! Спасибо!


  Давай, давай, давай, давай, давай! Ну ты даёшь! Да Нюша нам всё рассказала! Какие там сны
  устраивала? Правда? О чём вы? Ладно, ладно. Никто и не знал. Как это у тебя получалось?


  Бараш! Ты что, не помнишь? У меня во сне море, яхта и принц. А я-то тут причём?


  — А может, тебе это всё приснилось?— Ну да, мне это снилось. Но факт остаётся фактом: он
  появился во сне и забацал тот сон, который я попросила.— А что ты делала при этом?— Да ничего
  особенного. Сначала, чтобы уснуть, считала баранов Потом во сне по инерции некоторое время
  продолжала считать, а потом появился он. Может, за тысячи лет, что на сон считают баранов,
  у них выработалось свойство влиять на сны? Интересно, интересно! А я всегда считал слонов.
  Попробовать баранов что ли?


  Двести пятьдесят три барана! Господи! Я сплю или ещё нет! Ну, слава Богу!


  Убери меня отсюда!


  Что заказываем?


  Так. Для начала новые штаны.


  Понимаешь, ммм хочется чего-нибудь такого. Ну, ты же знаешь, у нас с этим дефицит, а так
  иногда хочется вздуть какого-нибудь негодяя.


  А! Ну, держись у меня! Спасибо, Бараш! Спасибо! И эта громадина зажимает меня в угол, всё,
  думаю, конец Копатычу! И тут я отталкиваюсь от стены и в прыжке атакую! Д-з-з! Какой-то
  кошмар, а не сон. Да? А ты что заказывал?


  У меня личное, вам будет неинтересно.


  — Он совсем не высыпается!— А ты что хотел? Сон для него— рабочее время.— Самое интересное,
  что он ничего не помнит из своих снов. Ему вообще никогда ничего не снится. Он создаёт чужие
  сны. А своих у него нет. Бедняжка!— Мы должны ему помочь!


  — Где я?— Ты спишь, дорогой. И это сон.


  Наконец-то! Какие будут пожелания? Что ты хочешь? Милый, я... Я хочу Спать!


  Вы'
