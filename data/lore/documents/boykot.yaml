id: boykot
title: Бойкот
text: 'Пожалуйста, дай.


  Бывают такие дни, когда весь мир лежит перед тобой, как вкусное пирожное. Всё становится
  ясно и понятно, никаких тайн, ни загадок. И это чувство все знания переполняет, словно словно
  и нужно общение, общение, потому что если ты всю эту мудрость кому-нибудь не Немедленно
  не расскажешь? Можно просто лопнуть? Крош! Ёжик! Немедленно идите сюда!


  А вы знаете, что самовар начинается на сайте на? Что если в него влить не просто воду, а
  газированную, да и чай будет газированный. А что горячий самовар лучше трогать в барышках?


  Чтобы не обжить.


  О, отлично, то, что надо! Э-э, где взяли?


  Неважно.


  Ну что вы делаете? Я сейчас объясню, как им пользоваться! Эй, эй! Не надо мешать! Ай!


  А! Так вы хотите сделать костюм клоуна? Так вы сразу и сказали:«Вам крупно повезло». Я сейчас
  скажу, как сделать самый смешной клоунский костюм. Вы знаете, что клоуны бывают трёх видов:
  белый, чёрный, рыжий и-и-и Это водолазный скафандр.


  Новенькая. Предлагаю сделать здесь пару крючков для пряка.


  Ай! Да вы что? Я не хочу так лучше! Иди погуляй лучше.


  Слушайте! Я что, со стеной разговариваю? Я с вами хочу поделиться своим опытом, знаниями,
  своей сегодняшней мудростью. Если хотите. А вы Ну что ж, вы сами напросились. Вместо того,
  чтобы с благодарностью пользоваться моим общением, вы непозволительно недооценили его. Я
  вынуждена вас наказать. Я объявляю вам Ай!


  Можно подумать, можно подумать, мне так нужно решать их проблемы. Сейчас набьют себе шишек
  и сразу прибегут. Нюше скажи, как, Нюше скажи, что. Но поезд уже уйдёт. Ничего! Зато это
  послужит им уроком. В следующий раз они не будут рубить сук, на котором сидят.


  Странно. Мне бойкот никто не объявлял, наоборот, это я всем бойкот объявила. А плохо почему-то
  только мне.


  Ха! Может, они просто не поняли, что им объявлен бойкот?


  Я с тобой не разговариваю.


  А знаешь почему?


  Нашёл! Нашёл А вот когда я была совсем маленькой, я боялась темноты. Да. Знаешь почему?
  Потому что в темноте всегда начинает казаться всё плохое, что только можно себе придумать.
  Например, привидения. Страшно, правда?


  Так вот, привидения появлялись когда Слушай, это невежливо. Я тебе такие вещи рассказываю,
  а ты Я тебе тоже объявляю бойкот!


  Я всем объявляю бойкот Ух ты! Ёлки-иголки!


  Опа! Оп!


  — Скажите честно, вы мне объявили бойкот? Вы со мной не разговариваете, да?— Почему не разговариваем?
  Разговариваем, просто заняты были.— Фу! Ну, слава Богу. Ага, клоунский костюмчик уже готов.


  А где карманчики? А куда клоун будет хлопушки засовывать, а? Давайте лучше я! Я знаю как!
  Я сейчас покажу вам их делать. Я столько читала про клоунов, что знаю про них всё! Я вам
  говорила, что их бывают три вида: чёрные, белые, рыжие. А почему вы молчите? Я с вами разговариваю.
  Хотя ладно, молчите, главное Слушайте, бывают грустные клоуны и смешные. Смешные клоуны
  не умолкая, видимо, шутят, и всем смешно. А грустные клоуны никогда не шутят. Они почти
  всегда молчат, но всё равно всем очень смешно.


  Что?


  Со мной опять никто не разговаривает?'
