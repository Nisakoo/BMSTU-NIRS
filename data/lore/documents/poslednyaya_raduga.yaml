id: poslednyaya_raduga
title: Последняя радуга
text: 'Стоп! Стоп! Глуши станок! Карыч, ты чего здесь написал?


  — Радуга, хмм, над поляной. Ха!— И что?— Что? Что, что значит что? Э-э, вчера была радуга,
  и я о ней написал.— Точно, была. Я видел.— Стоп! Мы какую делаем газету? Мы делаем газету
  интересную!


  Ну, по-моему, радуга— это интересно. Да. И-и это часть нашей жизни.


  Всё дело в заголовке. Заголовок должен быть такой, чтобы страсть как интересно было узнать,
  что же там такое написано. Например:«Радуга— мутант» или Последняя радуга в жизни! Вот!
  Почему ж последняя-то? Ха! Вот видишь, тебе уже интересно! Заголовки должны кричать. Ну,
  чтобы скучно не было Свежий выпуск! Свежий выпуск! Радуга мутант! Последняя радуга в жизни!
  И только у нас! Читайте, читайте! Увидите ли вы когда-нибудь радугу снова! А также кроссворды
  и эколонка юмора.


  И всё-таки мы ужас как скучно живём.


  Ничего не происходит.


  Когда я совсем не шутя.


  Нам нужно выпускать следующий номер! А мы даже не знаем, о чём писать!


  Я вчера уколол палец кактусом. Покажи! Нет, палец— это неинтересно.


  А! Придумал! Катастрофа на качелях!


  Свежий выпуск! Свежий выпуск! Катастрофа на качелях! Опасное падение Нюши! Только у нас!
  Читайте, читайте! Неужели Нюшу уже не спасти? А также кроссворды и эколонка юмора.


  В чём дело? Вот. Катастрофа на качелях. Ничто не предвещало трагической развязки. Нюша беззаботно
  качалась на качелях, как вдруг — Что вы тут напечатали? Какая катастрофа! Какая трагическая
  развязка? Это всё неправда!— Правда— это другая газета. А наша, чтобы скучно не было!— Я
  требую, чтобы вы напечатали, что со мной всё в порядке!


  Свежий выпуск! Свежий выпуск! Счастливое спасение Нюши! С Нюшей всё в порядке! На Копатыча
  напала гигантская гусеница! Только у нас! Читайте, читайте! Неужели Копатыча уже не спасти?
  А также кроссворды и эколонка юмора.


  Укуси меня пчела.


  Свежий выпуск! Свежий выпуск! Товарищ в безопасности! Таинственное исчезновение Бараша!
  Только у нас! Читайте, читайте! Увидите ли вы когда-нибудь Бараша снова! А также кроссворды
  и эколонка юмора!


  Слушайте, хватит бегать! Газеты для того, чтобы их читать, а не для того, чтобы бегать!
  Как же тут не бегать? Мы ж волнуемся. Ну не надо уж так-то волноваться. Хорошо. Больше.


  Не будем.


  Хм, знаешь, чего нам не хватает? Чего? Хорошего шторма! Цунами! Ха-ха! Представляешь заголовок?
  Крушение в море! А? Или-или Ёжик! Он тонет! Помогите! Я тону! Ага!


  Сейчас! Сейчас Крош тонет! Катастрофа! Крош тонет! Интересно. А на какой странице? Он тонет?
  Он тонет не на странице, а в море! Быстрее, быстрее же! Да! А подробности уже известны?


  Какие подробности? Это не газета, это жизнь, если уже не смерть. Кстати, хороший заголовок.


  Никаких больше волнений, никаких катастроф и сенсаций. Спокойные и скучные заголовки, заголовки,
  которые не кричат, а нежно, нежно шепчут.


  Что? Ничего я не слышу. Я говорю радуга.


  Правильно! Радуга над Поляной.


  И вовсе не последняя.'
