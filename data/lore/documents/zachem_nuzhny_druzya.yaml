id: zachem_nuzhny_druzya
title: Зачем нужны друзья
text: 'Привет! Привет! Есть. Слушай, у меня тут проблема деликатнейшего характера. Что случилось?


  Кажется, у меня осыпаются иголки Фу!


  Ну-ка попрыгай.


  А сколько?


  Ну, по-моему, всё как всегда Да нет же! Они у меня редеют! Посмотри! Да ладно! Чего ты так
  распереживался?


  У меня вон вообще иголок нет.


  Ай! Хм? И ничего, живу полноценной жизнью.


  Новости? Да какие новости? Всё, как всегда. А нет, у Ёжика же иголки сыпятся. Да ты ж —
  Вот это новость!— Хе-е, да!— Это стадо никогда в жизни не видал лысых ёжиков!— Да?— А когда
  же это у него началось-то?— Не знаю.— Ёжик!


  Да ты ещё ничего! Я думал, ты уж совсем лысый. Ну-ка, покажешь шевелюру! Зачем?


  Ну, я посмотрю, как у тебя иголки сыпются.


  Ты, наверное, съел чего-нибудь?


  — У меня ничего не сыпется.— Как не сыпется?— Да Крош сказал, что как бы, ну, у Кроша язык
  как помело. Сам не знает, что мелет.


  Я вообще-то прогуляться собирался, если вы не возражаете.


  Крош, можно тебя минуточку.


  Я же тебе сказал, что у меня деликатнейшая проблема! Что ты всем болтаешь? Я думал, ты мне
  друг, а ты просто балабол! Ёжик, да ты чего? Я тебе больше никогда ничего не смогу рассказать.
  Никогда, потому что у тебя язык Без костей.


  Не понимаю. А зачем вообще нужны друзья, если их нельзя обсуждать друг с другом?


  Без костей.


  Привет, Ёжик! Как дела?


  Даже не знаю, что тебе ответить. Вдруг я не хочу, чтобы все знали, как у меня дела. Вдруг
  я вообще больше не хочу о себе ничего рассказывать. Скажешь что-нибудь, а потом ещё неизвестно,
  как это о тебе отзовётся. Поэтому говорить лучше о чём-нибудь постороннем: о погоде. Хорошая
  погода, ветра нет, солнце, солнце.


  Солнышко.


  Ты бы шёл от этого солнца в тень? Совсем перегрелся.


  Язык как язык!


  Без костей. Так он и должен быть без костей.


  Зачем ему кости?


  — Вот он!— Бледный.— Больной к осмотру.— Сейчас мы разберёмся!— Что у тебя тут выпадает?—
  А что нет?


  Так, посмотрим. Повернись. Ой, хорошо, замечательно. Ой-ой-ой, пошили ротик большие. Оп.


  — Вот и да.— Хорошо.


  Такс. И чего это мы тут навыдумывали? Мнительные очень. Здоров как бык. Сказала бы я, что
  у тебя выпадает. Да слова уже такие забыла.


  Тем более. Ничего не было, а он всем рассказал.


  Вы видели, как я Эх Если ты так любишь всё всем рассказывать, то вот тебе новость. Я только
  что запустил одним камнем 20 блинчиков. Пожалуйста, рассказывай, кому хочешь. Чего?


  Язык прикусил.


  Вот когда не надо, язык-то у тебя работает, а когда надо— нет.


  Больно — А когда заживёт? Расскажешь?— Да.— Правильно. А зачем ещё нужны друзья? Ай!'
