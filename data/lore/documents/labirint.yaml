id: labirint
title: Лабиринт
text: 'Ларайра, дай вам тайн.


  А людям Ух ты!


  Чем занимаетесь? Да вот хочу полосу быстро растущего кустарника посадить, чтоб от ветра
  огород загораживал. Где ж её садить, если ветер чуть ли не отовсюду дует? Я не верю в простые
  решения. Одна полоса ничего не решит. Надо здесь, здесь и здесь. О!


  О, вам нужно посадить вокруг вашего дома лабиринт! Ветра не будет. Раз. Красиво, два— организация
  досуга— три. Такие решения называются комплексными.


  Вот назад. Так что назад? Сейчас переберёмся. А теперь налево. Там будет чудеснейший тупичок.


  А зачем тупичок? Какой вы смешной! Чем больше в лабиринте тупичков, тем он сложнее и интересней!
  Как я буду по этому лабиринту из дому и обратно? Сначала по схеме, потом привыкните.


  Когда мы создавали с Копатычем этот лабиринт, то думали прежде всего о простых вещах: чтобы
  не было ветра, чтобы выход из дома для Копатыча всегда был приключением. Но за зиму, пока
  лабиринт набирал рост, я придумал, что лабиринт станет ещё и всеобщим развлекательным аттракционом!
  И как в нём развлекаться?


  Икаться. А вот сейчас сами и увидите.


  Как вы видите, внутри лабиринта полно разветвляющихся дорожек, но только одна из них ведёт
  в сердце лабиринта. Поиск единственного правильного пути составляет увлекательнейшее соревнование.
  Кто первым достигнет центра лабиринта и пробудит от зимней спячки Копатыча, тот и победитель!


  Красота.


  Зашиби меня, пчела. А схему мне так и не дали.


  Пам-пам-пам, пам-пам-пам-пам-пам-пам. Теперь сюда. Пам-пам-пам-пам-парам-пам-пам-пам. Что,
  заблудились? Дерзайте, дерзайте! Пара-пам-пам-пам, пара-пам-пам. Пара-пам-пам, параба, параба.
  Теперь сюда. Так и сюда.


  Ну, это поиграли и хватит. Уже давно обедать пора. Эх, вы, даже и не попробовали по-настоящему
  пройти этот чудный лабиринт. Ну ладно, если вы такие ленивые, идёмте за мной. Эй, все идите
  сюда.


  Ой. Мы уже здесь были.


  — Ты сам-то знаешь, как здесь ориентироваться?— Конечно. У меня всё тут Во, видите, какой
  снаружи сильный ветер! А у нас здесь тихо и спокойно. Водички мы глоточек.


  Главное— найти домик Копатыча. Там у него запасов надолго хватит.


  Вы ничего не слышали?


  Нет тут ни Копатыча, ни запасов. А колодец где-то в лабиринте. Мы обречены. Да, долго без
  воды на такой жаре мы не протянем.


  Я слышу шум.


  Это галлюцинация от обезвоживание. У меня ночью уже было расти... Я тоже слышу.


  Какая-то косилка! Это смерть. Смерть с косой.


  Нас же много.


  Спасибо. Как хорошо! Да-да, вечер— это прекрасно.


  Друг мой, парадоксальный! И зачем вообще вам в голову пришла идея отгораживаться от ветра?
  Что за нелепая мысль? Мы тут все чуть копыта не откинули.'
