id: schastemet
title: Счастьемет
text: 'Пора удай тайн. Пора удай тайн.


  Хватит Ай забудь.


  Да здесь шрат, шут.


  Пин! Что это у тебя здесь? О! Изобретение, да? Найн, абсолютно бесполезный человечеству
  хлам. А куда ты это всё? В утиль.


  На спишу.


  Творческий кризис. Твин, погоди-погоди. Ну зачем же всё мучили? Вот, например, отличная
  вещь! Найн— это есть брак. А вот это классная же штука! Хлам! А это-то Пин, а? Дрянь! А
  вот это Nige. Смотри-смотри. Найн.


  Ну вот же ведь это просто прелесть! Какая вещица! Найн, никуда негодный барафон Ну вот хоть
  это, а? Может быть, хоть это пригодится человечеству? По-моему, это как раз то, что мне
  нужно.


  Ну вот что это, Пин, а?


  Это.


  Это счастье мёд.


  Что? Что?


  Ну, сейчас тебе мёд, понимает? Вот прицелился в какого-нибудь несчастного, пив-бав— и он
  счастлив навсегда.


  Э-э-э, не работает.


  Почему?


  Не хватает одной детали, очень важной. Ну так где она? Где же эта деталь? Эта деталь? Где
  она? Где-то здесь закатилось куда-то железный такой мячик.


  С дырочками.


  Нашёл ещё Нашёл ещё нет.


  Нет ещё.


  Нашёл.


  Ну, пошли к Пину.


  Знаешь, Крош, по-моему, теперь мы потерялись.


  Ничего, ничего! Вот выберемся, принесём Пину эту штуку! Он соберёт свой аппарат и будем
  все счастливы.


  Я был бы уже счастлив, если бы только выбрался Ну где же вы быть? Я так волноваться! Наконец-то
  я вас нашёл!


  Какое счастье — Вот! И мне пришлось быстро-быстро изобретать эта машина! Ну, чтобы вас искать.
  Мой склад ого-го большой! Ногами не обойти очень долго.— Классная машина!— Я-я полезный
  вещь!


  Ой! Она упала! Кто? Деталь, деталь от части меда! Да ты останови Пин! Надо поднять! А пустяки,
  мой друг, совершенный пустяки. Что сейчас вам нужно для счастья? Горячий чай и постель.


  Я'
