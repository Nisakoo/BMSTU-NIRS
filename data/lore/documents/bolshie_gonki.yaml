id: bolshie_gonki
title: Большие гонки
text: 'Мы ведём наш репортаж с ежегодной гонки на Кубок пустыни. Целый год все экипажи готовили
  свои машины к этому дню.


  Мы видим, как далеко за этот год ушли конструктивные мысли, новые идеи, новые решения будут
  проходить проверку в непроходимых песках. Останется совсем немного времени до старта. Итак,
  пять, четыре, три!


  Ай!


  Это есть фальстарт!


  Поехали!


  Это был фальстарт. Старт У нас самая быстрая машина! Кубок у нас в кармане! Главное— о поворотах
  сообщай заранее! И что? Заранее говори, как там поворачивать! Не слышу! Повороты заранее,
  чтобы я успел повернуть! А, хорошо!


  Скоро! Поворот налево! Что? Налево! Громче! Поворачивай!


  О, какое несчастье! Какая сенсация! Главный фаворит сходит с дистанции.


  Какая захватывающая гонка! Ну а мы прерываемся на рекламу, как всегда, в самом неподходящем
  месте.


  Когда я пользовался обычным шампунем, у меня на голове росло Невесть что.


  Вы знаете, что это? По-моему, ты любишь работать и умеешь отдыхать. Этот мир лежит у твоих
  лап.


  И если вы купите эту лыжу сейчас, то вторую лыжу вы получите совершенно бесплатно! Ой! Они
  же разного цвета! Так. А теперь мои волосы имеют максимальный объём! Ты чувствуешь вкус
  настоящей жизни, потому что у тебя — У тебя есть один огурец от Копатыча?— За качество отвечаю.


  Эй, ну и что, что у нас самый тихоходный гоночный автомобиль? Он даже вовсе не тихоходный,
  а неспешный и безопасный. К тому же можно спокойно смотреть по сторонам! Вон какая красота
  вокруг!


  Я бы ехал ещё медленней. Куда спешить? Гонку мы всё равно не выиграем! Но всё-таки некрасиво
  получится, если все будут слишком долго ждать нас на финише. Ой!


  А что случилось?


  Ну, не знаю. Садитесь к нам, что ли?


  Машины идут клюв в клюв. После того, как Флори сошёл дистанция, стало ясно, что Кубок выигрывает
  один из этих экипажей. Вот что именно пока ничего неясно.


  Укуси меня, пчела! Они нас обходят! Трансформируются!


  Кажется, один из лидеров нашёл дополнительные мощности.


  По техническим причинам наш репортаж прерывается. Мы победители, мы чемпионы Это финиш.


  Да-а. По-моему, нас ждать не стали. Да. Всё-таки мы ехали чересчур медленно.


  Кубок! Этого не может быть! А вы же говорили! Мы были Как, наверное, всё-таки здорово быть
  победителем! Ура! Ура! Ура! Осталось всего каких-то 50 км. Всего 10 ч пешком прогулка, и
  мы на финише! Аллес гут!'
