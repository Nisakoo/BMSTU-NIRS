id: komnata_grusti
title: Комната грусти
text: 'Это ужас... Ужасно, ужасно! Потрачено столько сил!


  И всё напрасно! Я так старалась, я так к этому готовилась! А они! Они меня предали! Так
  нельзя! Сначала они говорят, что сарафаны— это модно, а потом, когда ты потратишь столько
  физической и умственной энергии, чт-что Чтобы обзавестись сарафаном Они говорят, что такие
  уже не носят.


  Попробовали бы они мне сказать это лично, а не по радио! Ой, мамочки! Что это у меня с лицом?
  Это всё от слёз. Так. Надо держать себя в руках слёзы— первый враг красоте. Всем привет!


  Нюш, ты чего? Ничего, ничего. У меня всё хорошо. У меня всё в порядке.


  Ай! Всё в порядке! У меня всё хорошо, всё просто замечательно. Всё.


  У меня всё хорошо! Всё просто замечательно Лучше всех меня! Сама себе завидую, как всё здорово!
  Как я спокойна! Как всё замечательно! Как всё хорошо! Всё рас Здравствуйте Если грустить
  при всех нельзя, а грустить всё-таки приходится.


  То, наверное, можно грустить в специальной комнате, где никто ничего не увидит, ничего не
  услышит и не сможет мешать.


  Ой-ой-ой-ой-ой! Ой-ой!


  Нет.


  — Привет, Бараш!— Ты чего?— Понимаешь, я в компьютере, как бы тебе сказать, работал два
  дня, дошёл до двенадцатого уровня, а сохраниться забыл. Ты всё равно не поймёшь.— Да куда
  уж мне?— Никто не поймёт.


  Говорят, у тебя есть комната, где можно замечательно погрустить.


  Ты это, хмм, когда закончишь? Постучи.


  Нет, ну у меня, в принципе, всё превосходно. Так сказать, в лучшей форме и содержании. Ну
  так маленькие временные трудности.


  Ничего особенного. Нервы. Просто нервы. Осень. Время грустных мыслей.


  Осенью всегда немножечко грустно.


  Ой-ой-ой Ай-ай-ай.


  Сделает всё правильно. А это так рекат! Всё по инструкции. Занят. Каждый придётся подождать.
  Пудак занят. Комната грусти занята. Я не могу подождать. Мне так грустно, так грустно, так
  грустно! О май гад!


  Чего у тебя? Глупый механизмус! Я сделал всё правильно, всё по инструкции! А он не работает.


  Так, я не поняла. Вы сюда грустить пришли или разговаривать? К вам тут ещё один. И прошу
  не мешать друг другу.


  Почему я должен делать вид, что мне хорошо, когда мне в действительности плохо? Ты прав!
  Неправ! Послушайте лучше меня! Я вам расскажу, как я Вам ещё один погрустить. Обещал вести
  себя тихо.


  Великий послушай меня! Сделает всё! Как ты относишься? К поэтическим переменять.


  Вы когда-нибудь доходили до тринадцатого уровня?'
