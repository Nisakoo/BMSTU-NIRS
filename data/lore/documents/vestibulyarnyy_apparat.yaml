id: vestibulyarnyy_apparat
title: Вестибулярный аппарат
text: 'Смотри, стрекоза летит вверх тормашками! Ага. А яблоки с дерева падают вверх Ага. Захотел
  яблочко, потряс дерево и лезть наверх, пока оно туда не упало. Нет, вверх— это уже будет
  низ. И лезть не надо, потому что ты уже будешь вверху. То есть внизу?


  Ну, это как посмотреть. Хорошо вам? На головах стоите. А у меня вот с утра хандра. Аппетита
  нет, ничего не ем, еле хожу. Как думаете, когда меня совсем силы оставят, а? Бараш, будь
  добр, потряси яблоню.


  Ещё чего не хватало. Итак, силы на исходе. А вы мне предлагаете их на всякую ерунду тратить.
  Ладно, я сам. Опа!


  Ой! У меня чего-то вокруг всё кружится. Чего у тебя кружится? Ой-ой-ой всё кружится. Ой,
  вам хорошо. У ваших голов ещё есть силы кружиться.


  Ой.


  — Вроде дерево было справа. Я принял влево. А там опять это дерево!— Я вообще не понимаю.
  Ой! Где право, где лево?— Если смотреть снизу вверх, то право— это лево. А если слева смотреть
  направо, то вниз— это вверх. Ой.


  Ёжик, а почему тебя двое?


  Я один.


  — Ну, в своём роде.— Вам хорошо. У вас ещё есть силы разговаривать.— Вот так. Сюда. Назвался
  груздем, полезай в кузов.— О, Лосяш! Лосяш, у нас всё перепуталось. Выручай, друзья!— Что
  перепуталось?


  Мы стояли на голове, и всё было хорошо. А когда встали обратно, то чего-то всё вокруг стало
  не так.


  Всё понятно.


  Тебе хорошо? Тебе всё понятно?


  Где у этой картины верх?


  Там, где небо... Правильно! А у этой?


  Вот так могло бы быть и в жизни. Не было бы неба или другого ориентира вверху, мы бы не
  знали, где вверх, а где низ. Но у каждого внутри нас есть вестибулярный аппарат, который
  всегда говорит«где низ». Соответственно, вычисляется вверх, вправо и влево. Нас можно всячески
  переворачивать.


  — Опа!— Но мы всё равно в состоянии ориентироваться в окружающем нас мире.— А почему мы,
  постояв на голове, перестали в нём ориентироваться?— Потому что, встав на голову, опа, вы
  стали смотреть на мир с другой стороны, и вестибулярный аппарат перестроился. А когда встали
  обратно, опа, он опять начал пе-ре Перестраиваться. А так как он у вас не тренированный,
  то перестраивался очень долго. А что надо делать, чтобы перестраивался быстро? Тренировать.


  Кто же, кто же виноват, что подводит регулярно самый главный аппарат вестибулярный.


  Аппарат вестибулярный. Аппарат вестибулярный.


  Я стою на голове.


  Напеваю мою эту песню негромко, Не пойму, где проблема. Лево-вправо, всё теперь можно изменить.


  Встань на голову, и вот она другая голова Она была под рукой.


  Кто же, кто же виноват? Что подводит регулярно? Самый главный аппарат.


  Вам хорошо веселитесь.


  А ты чего всё хандришь? А чего веселиться-то? Воздух сегодня душный, жаркий, солнце жаркое
  и противное, трава противная и-и колючая. А ты с другой стороны посмотреть пробовал? С какой
  ещё? Например, с такой.


  Солнце вообще скрылось. Значит, уже не жарко Трава щекочет. Значит, уже не колет. Отпустите!
  Голова кружится. А вот вестибулярный аппарат нужно тренировать.


  Тоже тоже.'
