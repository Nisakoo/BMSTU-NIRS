id: vodnye_protsedury
title: Водные процедуры
text: 'Сегодня утром Ёжик решил сделать зарядку по всем правилам. Правда, не себе, а Крош.
  Фу! Всё.


  Обтирание.


  Если по всем правилам, то сначала нужно перейти к водным процедурам. Водные! Вот это да!
  Всю жизнь о них мечтал, об этих процедурах. Особенно водных.


  Обожаю зарядки по всем правилам! Сейчас мы эти водные процедуры на полную мощность включим.
  Может, не надо на полную?


  Ух ты!


  Ничего себе!


  Я так их себе и представлял. Эти водные процедуры.


  У меня такое чувство, что мы с тобой что-то забыли. Ничего не забыли. Всё по всем правилам.
  Сначала водные эти процедуры, потом обтирания.


  Вот.


  На прощание Кажется, мы забыли их выключить.


  Кого?


  Водные процедуры.


  Хорошие водные процедуры ещё никому не повредили.


  Так-с, так-с, так-с. Никакого шевеления, просто сонное царство какое-то. Я всегда говорила:
  в здоровом теле— здоровый Нет, это совсем не то. Никакого вдохновения. Вдохновение— это
  как река. Нет, как струя.


  Нет. Как стихия? Стихия? Ну конечно же, стихия! Вот оно, ключевое слово. Писать стихи— моя
  стихия! И день, и ночь пишу стихия Наконец-то мой лодка совсем готов.


  Хм, остался один маленький проблем.


  Зачем я её строю не на мокрое озеро? Куда? А ленточка перерезать.


  Ёлки-балки.


  И откуда, интересно, всё это взялось? Когда стихия на пути льда вернула? Запомни правило
  одно, запомни правило одно.


  По-моему, всё-таки скачет, Когда стихи на же под тобой крикнуть караул, В диховке крикнуть
  караул. Захочет вам любовь.


  Не надо. Дела у нас плохие. Да-да-да-да-да-да-да-да Это неправильная истерия! Когда стихия
  позади И даже впереди Свиска нет, Когда батуте сердце вдруг на бату Запрыгает в крути.


  Стихи-бики-да-да-да-да-да-да-да И вода расходится вокруг. Когда, когда, когда, когда? Когда?
  Когда, когда? Когда с тобой надёжный друг!


  Ну как? Все целы? Может, с лыжами помочь?


  Вот ещё. Кажется, пора перерезать ленточку.


  Можно всем поставить твёрдую четвёрку? С минусом Крошу! Я бы даже сказала, нашему Спасителю.


  Пять! Крош уникально Это они кому же ещё мне же Ёжик куда делась? А, это я водные процедуры
  выключил камнем обратно. Еле-еле запихал его.


  Так это что же получается? Это я во всём виноват!


  Нет, ты всех спас ты герой.


  Крош подумал: разве может герой одного и того же происшествия быть одновременно его виновником?
  Нет.


  Разве может виновник считаться героем? А Ёжик ничего не думай.


  Он просто радовался.'
