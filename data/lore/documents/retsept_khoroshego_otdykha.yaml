id: retsept_khoroshego_otdykha
title: Рецепт хорошего отдыха
text: 'Давай!


  Твой объём, не считая, так сказать, ушей.


  Восемь стаканов.


  А ещё кушай. Стаканов по двенадцать потянут.


  И того Тридцать стаканов! Растём!


  Шишки хмеля, листья мяты. Корень пустырника.


  А день кусты.


  Наверняка А-а-а! Корень пустырника.


  Ну как? Получается Какой ужас! Мы чуть не забыли про лепестки китайской розы!


  Милочка! Секрет любого успеха состоит в точном следовании рецепта. Шаг в сторону и всё.


  Я собирала эти рецепты всю свою жизнь. Здесь есть всё. Рецепт яблочного пирога. Рецепт домашнего
  уюта вечной молодости.


  Как выглядеть умной? Как выиграть в лотерею и т.д. и т.


  Ты должна записывать интересные рецепты. И-о, Андрей Аме! У тебя будет рецепты на любой
  случай жизни. А если, скажем, мне что-то нужно сделать, а рецепта у меня ещё нет? Опа! Надо
  спросить у меня. Опа! Иначе можно такого наделать! О-о-о!


  Вот тебе ярчайший пример! Крош и Ёжик решили принять ванну. Как это делать правильно, сами
  не знают, а спросить! Язык отвалится. Ворожба, ветрянка вечер при свечах. Ага. Вот. Ванна.


  А теперь замерим объём с морковкой! Так. Во-первых.


  Мыться надо в тёплой воде.


  А во-вторых! Добавляем и взбиваем до пены. В-третьих.


  Я тебя кидаю в воду! А ты лечебные травы!


  Я расслабься. Молодца! Отдыхает. Как отмокнет, потри ему спинку.


  Что такое рецепт?


  Рецепт— это инструкция какого-то момента жизни. Кто-то правильно прожил этот момент и записал,
  чтобы другие тоже могли прожить этот момент правильно. Точно, следуя этой инструкции! Ай!


  Чем больше всяких рецептов знаешь, тем правильнее живёшь. Вот и вся мудрость жизни.


  Фу-фух, что-то я устала. Надо немного отдохнуть. Ой. Ой! Ой-ой-ой-ой! Что такое? Что ты
  кричишь как резаная?


  Чтобы укрепить мышцы живота, Гутали не должен быть сухим? Интересно.


  О! Мои рецептики Ой!


  Крош Ёжик с ой!


  Что-то я устал. Надо немного отдохнуть. Вот.


  Потом! Тьфу! Нельзя! Когда все её премудрости оказались разрезанными на кусочки, в ней что-то
  перекипело. И она стала повторять, что устала и ни на что не реагирует.— Что-то я устала.
  Может, она действительно устала? И ей нужно отдохнуть?


  Какой замечательный воздух! Как хорошо здесь отдыхать! Господа немного воздуха.


  Нет, ей нужен какой-нибудь особенный отдых. Лечебный. Так, а кто-нибудь знает хороший рецепт
  лечебного отдыха? Здесь точно есть.


  Так, теперь выбить пыль, не нарушая поверхности ворса! Какого ещё ворса?


  Не знаю. Здесь так написано. Что-то я устала или нет? Хорошо, идём дальше. Поливать каждые
  три дня. Уже поливали. И не забывать удобрять. Уже удобряли. Ага, вот.


  Хранить в тёмном недоступном для детей месте.


  Что-то я устал. Надо немного отдохнуть, чтобы я не устал. Надо немного отдохнуть.


  Нюша здесь! Возьми новую тетрадь. Записывай. Рецепт хорошего отдыха номер один. Лечь на
  травку, раскинуть крылья и лежать, лежать, лежать.'
