id: fanernoe_solntse
title: Фанерное солнце
text: 'Настроение— сложная штука. То оно есть, а то его нет. У Бараша с наступлением осени
  настроение стало ху...


  Было куда-то потихоньку пропадать. Он решил пойти прогуляться и поискать его.


  Здесь! Быстрее сюда! Бегу, бегу! Теперь сюда! Бегу, бегу, бегу! Нет, нет, теперь сюда! Бегу,
  бегу, бегу.


  Хорошо! Ну так надо побольше прогреться, чтоб на всю зиму хватило. А если не хватит? Лучше
  не думать об этом.


  Бараш! Отойди! Солнце загораживаешь.


  Вообще-то, сегодня дождь обещали.


  Подъём! Солнце уходит!


  Сюда.


  Здесь солнце!


  Бесполезно.


  Угу.


  Лето кончилось.


  Но мы же не успели прогреться.


  Увы. У меня, к слову сказать, тоже настроение какое-то не солнечное. Пойду к Совунье, напьюсь
  чаю, может, поможет.


  Ёлки-иголки Да.


  Ну давай попробуем ещё разочек.


  Вот сейчас поднимем.


  Ну, как настроение поднимается?


  А теперь попробую с мятой и ольховыми почками. Эксклюзивно! Нашла наконец.


  Больше в меня не влезет.


  Какое тяжёлое у тебя настроение, а.


  Никак не поднять. Просто минусом ему за привидение.


  О, придумала! Я дам тебе рыбьего жира. Не настраивает даже рояль.


  Я и так чувствую себя рыбой.


  Кругом сыро, пасмурно.


  Мне бы немножко солнца.


  У тебя есть что-нибудь солнечное?


  Где-то были солнечные часы, но без солнца они не работают.


  Бараш думал, что теперь настроение у него появится только весной. Ведь и осенью, и зимой
  солнца так мало, что не успеешь толком настроиться, как оно исчезает.


  Солнце Не может быть!


  Вира!


  Так сказать, выше. Оптимально.


  Хорошо печёт.


  Я заварила чай из лесных ягод.


  Они целое лето впитывали в себя солнце, согревают и создают солнечное настроение, на пять
  с плюсом, а-а.


  Прогревает создаёт. Ну просто лето какое-то.


  Друзья стояли под зонтиком и чувствовали, как они греют друг друга своим теплом, накопленным
  ими за лето. Ещё они чувствовали, что этого тепла им хватит надолго и уж точно до следующего
  лета.


  Пара'
