id: anonim
title: Аноним
text: 'Все взрослые, которые не могут похвастаться тем, что с каждым годом прыгают выше и
  бегают быстрее, знают, что день рождения— праздник неоднозначный.


  Трудно поверить, но иногда его отмечать даже совсем и не хочется. Не хочется никого приглашать.
  Ну, если только чтоб все пришли сами, как бы невзначай.


  Бараш! Холодно! Холодно!


  Горячо! Горячо!


  Бараш! Холодно!


  — Эй!— Пол!— Спокойно, без рук.— Любезный Кар-Карыч, коли ты здесь никому не нужен, то я
  скоро заберу тебя отсюда.— Хочешь ли ты того или нет?


  А на Эй! Кар-Карыч! Кар-Карыч!


  Ты это видел?


  Любезный Кар-Карыч, никому не нужен, заберу тебя, аноним.


  Какой аноним?


  Что за дурацкие шутки?


  Так, поскольку мы выяснили, что никто из нас это написать не мог, возникает справедливый
  вопрос: кто же всё-таки это сделал? Никто не замечал в последнее время ничего странного?
  Каких-нибудь незнакомцев?


  Кто такой?


  Аноним? Аноним— это значит некто, пожелавший остаться неизвестным. И, может быть, кто —
  Угодно!— А что я ему сделал-то?— Не волнуйся, дружище, мы тебя никаким анонимом просто так
  не отдадим.— Нет, ну что я ему сделал?— Для выяснения личности Анонима и его мотивов мы
  должны обеспечить тебе безопасность. Его намерение забрать тебя, хочешь


  Хочешь ли ты того или нет? Могут оказаться весьма серьёзными.


  Ну как? Пока всё чисто. А вкус смотрел никаких анонимов.


  Хм, давай-ка что-нибудь поярче включим, чтобы ни один аноним не проскользнул.


  Поспи, поспи. Я посторожу. Так, у тебя есть какие-нибудь недоброжелатели?


  Может быть, ты вызывал у кого-нибудь, например, зависть, спрашиваешь. Разумеется, вызывал.
  Но недоброжелателей нет. Меня всегда все очень любят, всегда и все! Иногда, конечно, забывают
  об этом факте, но Чего ты там с контактами? Перепад напряжения, что ли?


  Ого! Интересно, интересно.


  Данная анонимка написана на одном из листков этого календаря. Это означает, что аноним был
  здесь. У него сюда есть доступ.


  Подкрутим ко мне быстро! Быстро!


  Это на всякий случай. Вдруг меня услышат... Всё будет хорошо. Никакой анонимности. Мои гарантии.
  Мы, конечно, понимаем, что в столь напряжённый момент опасно предаваться празднику. Но мы
  всё-таки не можем не поздравить нашего любимого Кар-Карыча.


  — Спасибо!— Спасибо.— Но день рождения у меня был вчера.— Почему вчера?— Сегодня же десятое!—
  Десятое было вчера.


  Поздравляем!


  Да нет, друг мой, сегодня десятое. Вы перед этим вырвали в календаре сразу два листка и
  один день пропустили. А я-то, старый дурак, уж подумал, что обо мне все забыли. Аноним может
  прятаться где-то рядом? Да нет никакого аноним.


  Это я написал А что вы хотели? Я накрыл стол, сидел, ждал. Никто не пришёл. Подарки тебе
  готовили на сегодня? Я же не знал! Я думал, что больше никому здесь не нужен. Надо было...
  Как ты мог вообще такое подумать? Слушайте, ну ладно, виноват я.


  Виноват. Вы, друг мой, не аноним. Вы хотите того или нет? Кое-что похуже Ну, простите меня,
  простите! Пойдёмте ко мне праздновать. Где мы? Э-э, там, где только мы. Где нас не найдёт,
  хочешь того или нет? Ни один аноним. Обещаю.'
