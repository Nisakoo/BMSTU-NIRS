id: polety_vo_sne_i_nayavu
title: Полёты во сне и наяву
text: 'Известно, что Пин читал только те книжки, где говорится о машинах и разной технике
  Но однажды Пин совершенно случайно наткнулся на книжку, где не было ни чертежей, ни сухих
  цифр, а были необычайные герои, которые попадали в удивительные истории.


  А? С непривычки Пину трудно было остановиться.


  И он читал всю ночь.


  Когда же он закончил? Выспаться совсем не оставалось времени. А на 7:00 утра была запланирована
  важная работа, отказываться от которой было уже поздно.


  Короче, здесь пшеница, там гречиха. Я думаю, на каждое поле по два захода хватит. Сбрасывай
  так, чтобы опылялось равномерно. Слышишь?


  Что говорю? Ну всё.


  От винта Мечтает быть пилотом Очень смелый енот, Потому что только смелый сам полезет в
  самолёт, Потому что только смелых уважает высота, Потому что в самолёте всё зависит от винта.


  А!


  Развин.


  Финта.


  У пилота есть работа, Он летает самолёт. У пилота есть забота, Если вдруг пилот уснёт— Потому,
  когда приятель, Ты надумаешь летать, Не забудь, что ты летатель, И не спи в кабине спать.
  Хорошо! Хорошо!


  Ещё раз!


  Сбрасывай! Сбрасывай!


  Да что ж это такое? Полезен для здоровья, а здоровье нужно всем. Но когда ты в самолёте,
  у тебя миллион проблем. Под тобою километры, Над тобою облака, И вздремнуть ты можешь только
  на земле летишь пока.


  Потому что в самолёте всё зависит от винта.


  Надвигается область низкого давления. Ветер 5—7 м. Возможны небольшие осадки.


  Феноменально.


  Ёлки-иголки! Это что это такое тут происходит? Любезный, объясните нам! Пожалуйста. Я сам
  ничего не понимаю.


  Кажись, с Пином что-то не в порядке.


  Сон полезен для здоровья, а здоровье нужно всем. Но когда ты в самолёте, у тебя миллион
  проблем. Под тобою километры, над тобою облака, И вздремнуть ты можешь только до земли летишь
  пока.


  Давай.


  А-а! Идиотом! Просыпайся! Потому что только смелый сам полезет. Что утром? Потому что только
  смелых уважает высота, Потому что в самолёте всё зависит от тебя Да, староват я стал для
  таких полётов.


  При движении самолёта с малыми, дозвуковыми скоростями в соответствующим числам M, конкретное
  значение которых зависит от формы обтекаемого тела. Тьфу, какая-то Это Абракадабра.


  То есть можно считать, что плотность воздуха равна константе.


  В книжках герои попадают в страшные передряги, и как с гуся вода А в жизни чуть что и Другие
  законы физики, что ли?'
