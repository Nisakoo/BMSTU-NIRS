id: futbol_1_y_taym
title: Футбол 1-й тайм
text: 'Мы видим, что очень трудно командам показывать хороший футбол на таком вязком поле.
  Время есть ещё отыграться, есть! И судья, возможно, добавит пару минут, которых хватит нашим
  ребятам для атаки. Так, очень удачно наши футболисты перехватили мяч в центре поля, и появилась
  прекрасная возможность для атаки в свободную зону. Устремляются сразу двое наших нападающих!


  Стопроцентный момент выход один в один! Двадцать удар! Да что такое?! Да что же это такое?!
  Нашей команде очень нужно поторопиться, чтобы добиться положительного результата! Снова
  мяч у наших защитников, пас Василию. Ну что, последняя атака! Нет времени катать мяч. И
  длинным пасом.


  Закидывает его в штрафную. Чернову удаётся выиграть борьбу, он оттесняет. Нет, это забары,
  иду мимо Упусти меня судья! Кто ж так играет? Чтобы выиграть, надо хотеть выиграть Они хотят,
  но не могут. Тактика неправильная. Тактика, братва, главное— настрой! Ха-ха-ха! Сразу видно,
  что ты ничего, любезный мой, не понимаешь. Тактика, схема и план решают всё.


  Это ты ничего не понимаешь. Побеждает тот, кто этого больше хочет. У кого настрой лучше.


  — У кого лучше тактика?— Настрой! Тактика!


  Спорим.


  Спорим.


  А как будем решать, кто прав. Методом экспериментального матча. Кто выиграет, тот и прав.


  Играть будем по тактике, которую я назвал— Бермудский треугольник. Всё очень просто. При
  атаке соперника мы отдаём им всё пространство. И вот так. Они теряются в нём и исчезают,
  как в Бермудском треугольнике. А мы забиваем гол.


  Понятно.


  Ладно, повторяю.


  Хе-хе-хе! Им нужны лёгкие игры, тактики и схемы, а прирождённым победителям нужно настроиться
  как следует, выйти на поле или выходить с него до полной победы!


  Так, настроились! Где огонь в глазах? Где жажда победы?


  Ещё больше огня!


  Оле, оле, Оле, Оле.


  Тихо-тихо!


  Глаза огонь! Настрой!


  Браво! Браво! Так, сюда и туда. А теперь диагональ. Диагональ!


  Диагональ Ай! Чё катай!


  Нет, нет, нет, нет, нет.


  Ну! Ну! Ну, ну, ну, ну!


  Люк.


  Перерыв.


  Молодцы! Когда соперник видит перед собой правильно настроенную команду, он сам себе забивает
  голы. Но не расслабляемся.'
