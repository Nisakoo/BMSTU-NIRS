id: put_v_prilichnoe_obshchestvo
title: Путь в приличное общество
text: 'Сердце красавицы склонно к измене, перемене, как ветер мая.


  Крош! Ёжик! Эй!


  Ну и идите себе Без вас даже интересней.


  Ребята, ну-ка не свистите! Денег не будет! А это я свистела! Как ты? Этого не может быть!
  Девушки не должны свистеть никогда! Это рифмично. Хорошо.


  Разогревы и немного соли. Ой.


  И периома.


  Нюша! Ты же опять свистишь! Ой, это у меня машинально получается По привычке. Это очень
  вредная привычка. От неё надо отучаться в приличном обществе, куда ты обязательно попадёшь,
  когда вырастешь. Свистеть не принято!


  А как же мне отучиться?


  Была у меня в юности привычка неприлично громко смеяться. Но я взяла себя в руки Целых два
  года совсем не смеялась. И привычка исчезла. Тебе тоже нужно два года не свистеть. И привычка
  исчезнет.


  Вот, Нюша! Посмотри, какую тыкву я вырастил! Я назвал её Во! Жёлтый гигант.


  Ой!


  Как же я могу отучиться, когда и не замечаю, как начинаю свистеть? Копатыч! Как отучиться
  от вредной привычки, а?


  Есть одно старинное средство. Я вот когда-то прошу прощения, любил поковыряться в носу.
  Один раз доковырялся, что чуть палец не сломал, решил:«Хватит, надо завязывать». И когда
  обнаруживал у себя палец в носу, то бил сам себя крепкий щелбан. После пятисот щелбанов
  привычки, как ни бывало.


  Да что ж это такое, а? Третьего дня кабачок, а сегодня, понимаешь, тыква, да? Моль ты, ей-богу,
  мне это не подходит. А то ещё привыкнешь к щелбанам, потом от них надо будет отвыкать. Мне
  нужно какое-нибудь современное средство.


  Свист происходит следующим образом. При выдохе воздух выходит из лёгких, попадая через горло
  в полости рта и оттуда наружу. Однако, если на своём пути он встретит особо сложно сформированное
  препятствие, например, губы сложены трубочкой, или, например, два пальца, то получается
  Получается свист. А что нужно сделать, чтобы свист не получился? Достаточно исключить выход
  воздуха наружу.


  Я ж тогда не смогу дышать! Логично. Ой! Мне никогда не попасть.


  Приличное общество Лосяш, а у тебя есть какая-нибудь вредная привычка?


  Вообще-то, я люблю есть во время чтения и могу за один вечер съесть недельный запас продуктов,
  даже не заметив этого. Ну, и как ты с этим борешься?


  Я пока только готовлюсь к борьбе. Но у меня есть план: когда-нибудь я сяду за книгу и специально
  стану есть, есть и есть, пока не объемся настолько, что никогда больше не смогу смешивать
  духовную пищу с телесной.


  Точно! Мне нужно насвистеться в сласть так, чтобы на всю жизнь хватило!


  Чего это ты тут рассвистелась?


  Ой, Бараш! Ты даже не представляешь.


  Как это трудно!


  Избавляться от привычки.


  Зачем тебе от неё избавляться? Мне вот наоборот, привычку нужно вырабатывать.


  Это какой ещё?


  Привычку здороваться, а то я по рассеянности забываю. А в приличном обществе без такой привычки
  нечего делать.


  Да, сложная эта штука, приличное общество.


  Сложная.


  Кстати.


  Здравствуй! А! Здравствуй, Бараш!'
