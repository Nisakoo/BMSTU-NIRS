id: sobytie_veka
title: Событие века
text: 'Не может быть! А? А?


  Полное затмение Мы чуть не пропустили событие века!


  Ёжик.


  Тебе не кажется, что жизнь стала какая-то Какая-то обыкновенная.


  Ничего не происходит.


  — Да и мы уже давно ничего не делали великого. Ты как считаешь? А? Может, пойдём в поход?—
  В поход? На Северный полюс? На сломанных лыжах. М-м-м.


  Завтра рано утром на восходе солнца будет наблюдаться полное солнечное затмение. Такое бывает
  раз в 100 лет.


  Так что не пропустите!


  А я пока предупрежу остальных.


  Оба-на! Солнечное затмение рано утром.


  Надо пораньше лечь спать.


  Ёжик! Ёжик!


  Смотри! Буду наблюдать вооружённым глазом! Здорово! Спокойной ночи.


  Спокойной ночи.


  Что случилось?


  Будильник проверил.


  Ага, понятно.


  Что там у тебя?


  Я их тоже проверил Молодец Ну Письма Ёжик! Ты спишь?


  Мне вот тоже что-то не спится.


  Я вот думаю, как нам повезло! Событие-то какое— раз в сто лет. А мы его увидим, будем потом
  всем рассказывать, надо будет всё запомнить до мельчайших подробностей! Да? Но прежде надо
  как-то заснуть. Точно, точно.


  Надо хорошенько устать. Когда устаёшь, всегда спать хочется. Я так устал.


  Что теперь точно не усну. Ты просто недостаточно устал! Давай, Ёжик, давай! Ещё кругов 30,
  и мы уснём как младенцы!


  Ещё полкруга, и я усну навсегда. Ёжик! Утром— событие века. Надо выспаться. Раз в сто лет
  можно потерпеть. Давай, вставай же! Спи, моя радость, усни! Левой! В доме погасли огни!
  Правой! Птички затихли в саду! Левой! Рыбки уснули в пруду! Правой! Дверь ни одна не скрипит!
  Давай!


  Ну-ка тихо!


  Понял.


  Ну что вы в самом деле? Времени-то сколько уже?


  Я всегда хорошо спал в поездах, потому что там так сильно укачивает.


  Едешь в вагоне? Тю-тюх, ти-тюх.


  Чюжу.


  Карыч! Карыч! Я прочухал, уже станций пять и ни в одном глазу. А-а! А, я знаю, знаю. Здесь
  остановка 30 минут. Можно сходить в буфет.


  Знаешь что, Ёжик, скоро восход, и ложиться спать уже просто бесполезно! Надо дождаться солнца,
  потом его затмения и со спокойной совестью пойти спать.


  Подумать только— События века. Кому расскажешь— не поверят. А солнечное затмение— это тебе
  не хухры-мухры.


  Ма.


  Читок-чутёк. Читёх-чутёх'
