id: zheleznaya_nyanya
title: Железная няня
text: 'А зачем нам роботы?


  — Как зачем?— Он будет за нас всё делать.— Вот ты убираться любишь?— Нет.— Вот! А он будет
  за нас убираться! И посуду мыть, и в общем, всё такое.


  — И думаешь, Пин его уже сделал?— Конечно! А чё там делать-то?— Я бы и сам сделал. Но ты
  же знаешь, я не механик, я больше по теории. Пин!


  Спит что ли?


  Пин, давай просыпайся.


  Никого нет?


  Хм, куда же он делся? Странный какой-то этот Пин. Вот как не придёшь к нему домой, он всё
  время куда-то девается.


  Слушай, Крош, пойдём отсюда. Что-то тут Крош.


  Крош.


  Пин.


  Исчез.


  Кто это?


  Понятно.


  Что? Что понятно? Мне лично ничего непонятно.


  Пина похитили! Марсиане.


  Спасайся! Марсиане Давай, Луноход! Подходи! Сейчас ты узнаешь, что такое боевой кролик в
  действии!


  — Крош, это я. Пин их.— Пи-пи-пи-пи-пи-Пин. Я думал, что ты это марсианин, как тот, который
  бегает у тебя по двору.— Найм! Это механический няня, который я сделал для тебя. Но он получился
  слишком няня, слишком заботливый, агрессивно-заботливый. Можешь его забирать.


  — А я пока здесь прятаться!— Нет, отпустите! Не хочу, не надо!— Это я...— Не надо, отпустите!—
  Ямщик!— Нет, не надо! Отпустите!— Не хочу! Не надо! Спасите, помогите! Крош!


  Ёжика надо спасать. Боюсь, он долго не продержится. Я, так сказать, взрослый. Мне не нужны
  пелёнки. Эй, железное чучело! Не хочешь обо мне позаботиться?


  Ку-ку, мой либо мир!


  На помощь.


  Да ну тише.


  А здорово мы её! Ай-ой-ой!


  Мы пропали.


  Возьми.


  Батарейка кончился.


  И больше не включай занянчить.


  Я бы таких нянь на гвозди распинал.


  Ёжик! Я тут подумал, а зачем нам, собственно, робот? Что мы сами не можем всё сделать? Конечно,
  можем. А то от этого железа больше хлопот, чем пользы. Вечно надо батарейки менять. А если
  его, так сказать, заглючит, то не поймёшь, чем кончится.


  Хорошо то, что хорошо кончается.'
