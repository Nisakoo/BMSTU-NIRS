id: nevospitannyy_klon
title: Невоспитанный клон
text: '— Что с ним случилось?— Катастрофа! Он вернулся! Он нашёл меня! Это катастрофа!— Спаси
  меня, Пин! Успокойся, кто тебя нашёл?


  Никто не знает, но в юности у меня был ужасный характер.


  Я был капризным и спесивым обалдуем. Я был таким вздорным, что со мной никто не дружил.
  И, конечно, мне было одиноко. Но у меня были знания, талант и ключ от кабинета биологии.
  Я решил тайно клонировать себя и сделать своего двойника.


  Двойника. Я рассчитывал, что мой двойник будет такой же обалдуй, как и я. И я не нужен.
  У меня появился друг, достойный меня. Мы были ещё той парочкой. Даже не хочу вспоминать,
  что мы вытворяли. Ужас! Ужас! Но со временем Со временем я стал понимать, что быть гадким
  хулиганом глупо, а добрым интеллигентом, наоборот, очень умно. Но Клону такие перемены были
  не по душе. Он преследовал меня и моих новых друзей, требуя, чтобы я вернулся на скользкий
  путь невоспитанного человека.


  Мне пришлось скрываться от него. И в конце концов он потерялся. Но сегодня, спустя много
  лет, когда я уже давно и забыл о нём, он объявился снова. Не волнуйся, я тебе помогу. Где
  он?


  У меня дома Дружбана привёл. Тут самим есть нечего.


  Э-э-э. Я вас собирался попросить, э-э-э Битта! Бит-те, дри-хе-хе-хе. Смешной. Будем тебя
  звать Чиполлино. Ну что, Репси, наведём шороху на это садоводство.


  Во-первых, бы вам не есть репси. Во-вторых, слушай, чипа, не зуди. Я этого не приветствую.
  Не тормози, не тормози!


  Я не перенесу этого позора. Я должен уехать. Из-за меня не должны страдать остальные. Должен
  быть какой-то другой выход.


  Мы посадим его на лодку и включим автопилот. Я установил автоматически навигатор на один
  порт в моей далёкой фатерля. Когда попадёт туда, он узнает, что такое чудесная дисциплина.
  Он там быстро станет как шёлковый. Главное— заманить его сюда.


  — Кого заманить?— Меня!— Чиполлино!— А я думал, мы друзья. Я вам никакой не Чиполлино, и
  вы мне не есть друг. Вы есть совершенно невоспитанный и славный хулиган!— Лосяш! Надо проучить
  этого предателя.— Тебе луч- — Тебе лучше уйти отсюда! Мир большой! Хватит места и такому,
  как ты.— Ты что, забыл? Ведь я— это ты!— Ты меня таким сделал!— Я давно стал другим, и ты
  за это время мог бы хоть чему-нибудь научиться, а не писать до сих пор гадости на заборах.


  Порох и бить стёкла! Мелкий хулиган! Мелкий хулиган! Сейчас ты поймёшь, что кое-чему я всё-таки
  научился. Сейчас я сделаю такую гадость! Век не забудете!


  Нас изжгут, там его перевоспитают. Не знаю, типа, не знаю. Он так изменился.


  Будем тебя звать Чиполлино.'
