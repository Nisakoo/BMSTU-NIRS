id: magnetizm
title: Магнетизм
text: 'Бараш! Иди сюда Иди сюда.


  Ну ты уверен, что здесь? Ну да.


  Вот дерево!


  А что мы ищем? Да Крош осенью закопал бидон с морковным соком, а теперь найти его не может.
  А зачем он его закопал? Чтоб настоялся! И-и-и Ха-ха! Нашёл! Иди!


  Ну-ка! Эй! Ну давай, бери за меня! Э-э-э!


  Ай!


  Ой-ой-ой!


  Кто это?


  Ух ты! Здорово! Слушай, Ёжик, а вы это просто нашли? Интересно! Покажите!


  Что это?


  Это... Ну что такое?


  Это магнит.


  Он обладает способностью притягивать бидон! Если бидон большой, то... Ну кому нужен бидон?


  А можно ли им притягивать интересных собеседников, а?


  — Магнетизм присутствует во многих явлениях.— Подожди, Нюша! Мы его нашли!— Вам-то он зачем?
  Вы и так с Ёжиком намагничены, за уши друг от друга не оттащишь!— Нюша!


  Ну, давай, Бараш, притягивайся.


  Расстояние что ли большое?


  Э-э-э! Не надо было отдавать магнит Нюше. Мы бы с ним быстро мой бидончик нашли. Слушай,
  а ты уверен, что вообще его закапывал? Мы тут уже всё, как кроты перекопали! Если ты мне
  не веришь, то и не надо. Без тебя найду. Больше достанется.


  Ну и, пожалуйста.


  Бараш? Ты ничего такого в себе не чувствуешь, а?


  Нет. Что я должен?


  Как что? Притяжение Ай! Ай! Ай-ай-ай-ай! Что это у тебя тут всё двигается?


  Ой!


  Ай! Ай-ай-ай-ай! Да что это такое?


  Ай! А-а!


  Ой-ой!


  Нюша, ты не могла бы одолжить на время магнит Кажется, мы с Крошем размагнитились.


  Да этот магнит ничего, кроме железяк не притягивает Заметьте, что магниты могут не только
  притягиваться, но и отталкиваться друг от друга.


  — Это касается только железяк?— Нет, это закон природы. Всё, что может притягиваться, если
  неправильно перевернуть, может и отталкиваться друг от друга.— Так, если притягивался, а
  потом стал отталкиваться, значит, твой магнит Неправильно перевернулся! Никто моего бидончика
  не видел? Жёлтенький такой. Нюша! Я почувствовал! Да, я так! Я почувствовал, что у меня
  пропала вся посуда!


  А как сделать так, чтобы наши магниты перевернулись и больше не отталкивались?


  Перемена полярности магнита— очень рисковный эксперимент. Но, может быть, нам повезёт, и
  мы не только останемся в живых, но и снова станем притягиваться.


  Крош! А у тебя перевернулся твой капризный магнит?


  У меня слава'
