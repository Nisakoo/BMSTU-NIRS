id: orz
title: ОРЗ
text: 'Он всю ночь вычислял скорость порывов солнечного ветра. Конечно, заболеешь тут, когда
  только ветер в голове.


  А?


  — Больно!— Да всё нормально, заботливые вы мои.— Не мешай!— Чуть-чуть прихворнул.— Это инфлюэнца!—
  Глупости!— Элементарно, ОРЗ.— Инфлюэнца?— Точно, инфлюэнца.


  Я знал одного доктора наук. Ему тоже всё время говорили: ОРЗ, ОРЗ, а потом Оказалось, инфлюэнца.


  Вот теперь больно! Хорош! Я-я нечаянно. Тебе же сказали: не мешай. Бараш, дорогой, посиди
  здесь.


  Лосяшу требуется всё наше внимание Бараш!


  Помоги.


  Что это у тебя? Варенье!


  Малиновое вкусно.


  Положи обратно! На что? Это же больному Не грызи лёд.


  А то заболеешь?


  Как приятно заболеть Все начнут тебя жалеть.


  Разноцветные таблетки из грядки баночек и ветки— не хороший, не плохой, Просто бедненький-больной.
  Ни хороший, ни плохой. Просто бедненький-больной. Бедненький-больной.


  Ни хороший, ни плохой, Просто бедненький больной, Бедненький больной! Давай! Чем скорее
  вскроется лёд, тем скорее наступит весна. А мы ей в этом поможем.


  Смотри.


  Бараш! Ты чего туда залез? Простудишься! Вот и хорошо! Чего в этом хорошего? А чего плохого?
  Все о тебе заботятся, лечат, переживают, кормят малиновым вареньем.


  Мандарины. По-моему, он уже заболел и бредит. Надо его спасать. Как приятно заболеть.


  Все начнут тебя жалеть творенье эффективное леченье на здоровье, дорогой Ни хороший, ни
  плохой. Просто бедненький-больной. Бедненький-больной Не хороший, не плохой. Просто бедненький
  больной больной.


  Будут все тебя жалеть.


  И выходит от болезней все становятся любезней и качают головой.


  Ни хороший, ни плохой. Просто бедненький больной. Бедненький больной.


  Хороший, не плохой. Просто ведь мы небежется. Я заболел.


  Ой! А я-то нет! Ничего, ничего. Сейчас доберёмся до дома, и всё будет хорошо.


  Ёлки-иголки Ёжик! Крош! Что случилось? Вы как-то нехорошо болеете, без удовольствия. Нет,
  не надо. А-а. Ой, хочу.


  Помогите! Помогите!


  Ой, плохо.


  Держи! Держи! А вот это точно инфаркт.


  Просто какая-то эпидемия! Двадцать уколов! И они как новенькие! Надо узнать, не заразился
  ли кто ещё?


  20 уколов! Ух! Ешьте сами своё малиновое варенье.


  Хороший, не плохой, просто бедненький, больной. Маленький.'
