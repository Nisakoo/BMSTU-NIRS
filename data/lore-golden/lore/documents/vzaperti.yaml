id: vzaperti
title: Взаперти
text: 'Дроби десятичные. Так, система координат. Ага, и парабола. Так, здесь функция не идёт.


  Ну что? Готово!


  Ну я. Да, можно проверять.


  Эх, давай!


  Два умножим на три и на квадрат суммируем шесть кубов. Замечательный объём! Друг мой аграрный!
  Вашему огороду теперь не страшны никакие засухи!


  Это прекрасно! Это просто прекрасно! Я так вам всем благодарен Протекает.


  Где там небольшой дырочка? Сейчас найдём и завалим.


  Так-так-так. Светите лучше, любезный.


  Давайте сделаем перерыв и перекусим. Не надо работать на износ. Тихо, тихо. Нашёл! Вот она!
  Э-э-э, точно!


  Ну, теперь можно и перекусить.


  Скажите, а люк у нас случайно не захлопывается?


  Бесполезно! Он захлопнулся Ну кто так делает люки? Я делал по твоим расчётам! Не ссорьтесь,
  надо успокоиться и подождать, пока кто-нибудь снаружи нас не откроет.


  — Кар-Карыч, ты бы села!— Уже глаза болят!— Я не могу сидеть. У меня лапы затекли.


  Друг мой монотонный, вы не могли бы перестать стучать? Я подаю сигналы, чтобы нас услышали!


  Нас никто никогда не услышит! Нас никто никогда не найдёт! Я не могу! Я задыхаюсь! Пустите!
  Пустите меня!


  Кажется, Ёжик боится замкнутое пространства. Клаустрофобия. Солнце цистерну нагревает.


  Горячо!


  Больно. Слушайте, бегайте в другом месте. В каком другом? Не знаю. Главное— не мне на ноги.
  Всё, больше не могу. Где выход? Выход где? Мне надо выйти.


  Как ты думаешь, куда мы катимся?


  По моим расчётам, в сторону моря.


  Вот она солёная.


  Слушайте, мы же так утонем.


  Постойте! А о чём я буду писать?


  Тихо! Тихо! Хватит придираться друг к другу! Нам всем здесь несладко. Если мы не перестанем
  ссориться, нам Всем здесь каюк! Мы сможем выбраться отсюда только сообща! Какие есть предложения?


  Прибой там нам туда.


  Разворачиваемся Ну за работу!


  Не останавливаемся быстрей, быстрей!


  Небо.


  Эх, хорошая была цистерна.


  Не переживай, починим мы её. Ну и как мы её дотащим до огорода?


  Так, секундочку. Сейчас корень квадратный, если здесь разделить, ага, сообща.'
