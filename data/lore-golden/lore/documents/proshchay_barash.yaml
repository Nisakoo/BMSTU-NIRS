id: proshchay_barash
title: Прощай, Бараш!
text: 'Пожалуйста.


  По-моему, плавать на кораблях могут только глупые люди. Эх, Нюша, ты никогда не сможешь
  понять, как порой мужчине не хватает солёных брызг, порыва бешеного ветра, морской болезни.


  Лесным им не хватает. А ведь так просто сел и поплыл. Дружище! Да ты никак собрался в кругосветное
  путешествие и никому не сказал? Я — Так ты уезжаешь?— Но... Кругосветное путешествие...
  Это же так долго!— Да нет, вы меня неправильно поняли Я буду скучать. Пойдём отсюда. Женщины
  для путешественников.


  Самый страшный якорь.


  Да. Морские путешествия— это замечательно. Новые странные ощущения. Опасности! Опасности!
  Должен признать, что произошло некоторое недоразумение, никакого путешествия не будет! Конечно.


  Конечно, не будет. Какое может быть путешествие без компаса? Вот и я ищу Нашёл! Вот, держи!
  Теперь можешь отчаливать на все четыре стороны. Прощай, друг.


  — Бараш!— Ну ты даёшь!— Мы всё знаем, ты отчаливаешь в открытое море.— А с виду такой тихий,
  домашний.— А у тебя корабль, э-э, на моторе?— Какой корабль?— Так у тебя нет корабля!— Да
  и никогда не было и вообще!— Ха-ха, так ты это — Это молодец, что к нам обратился! Быстрее
  нас с Ёжиком тебе корабль никто не сделает!— Точно! Пароход, конечно, не обещаем. Но плавать
  будет.— А ведь серьёзный круиз пока невозможен?— Конечно, невозможен! Пока мы не позаботились
  о чём?


  Правильно! О провианте!


  Видишь, какое тут дело? Копатыч!


  Бараш отправляется в кругосветку! Опа! Разрази меня гром! Сам в шоке. Так вот, Копатыч Кругосветное
  путешествие— дело долгое, а в океане с магазинами туго.


  Ага. А кушать хочется даже когда ещё бушует ураган Вот всё самое свежее.


  Оп! Спасибо!


  Бараш. Я вот тут подумал: в этом году овощи уродились, хоть ушами ешь, а хранить негде.
  Ты ж надолго уезжаешь. Вот. Может, мы пока твой домик под склад оборудуем, а? Что добру
  пропадать? Нет!


  Что? Отличная идея!


  — Прощай, Бараш! Семь футов тебе под килем! То есть я хотел сказать кругосветное путешествие?—
  Хо-хо! Что же ты молчал?— Это же бессердечно посылать тебя вот так с пустыми руками! Подожди,
  я Я сейчас всё исправлю.


  Ну вот, теперь совсем другое дело. Это тёплые вещи и настойки на все случаи жизни. Ой, погодите,
  я кое-что забыла. Пишем.


  Принимай работу! Бараш! Мы назвали его Ураган. Только название некуда прикрепить, но табличку
  можно держать в руках.


  Мы провожаем в дальний путь нашего незабвенного Бараша! Ну почему я всегда опаздываю? Пин,
  руби канаты!


  По традиции я разбиваю бутылку о борт этого славного судна.


  Бараш! Ура!


  Люблю! Люблю!


  А!


  Я же говорил, не надо! Я вообще воды боюсь. Вы бы меня ещё на Луну отправили!


  О Так что ж ты сразу никому не сказал, дружище?


  Покорение космоса! Отличная идея!'
