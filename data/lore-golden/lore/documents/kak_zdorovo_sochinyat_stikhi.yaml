id: kak_zdorovo_sochinyat_stikhi
title: Как здорово сочинять стихи
text: 'Нюша встала рано утром.


  Она переделала по дому все дела.


  Успела прочитать книжку, полить цветы и даже отправить письмо Ну вот хлопоты закончились,
  и Нюша загрустила. Ой. Ну что же делать? А ты что делаешь? Как что? Работаю?


  А я вот не знаю, чем заняться. Он уже убежал. Затем Нюша второй раз полила цветы.


  И вымыла пол.


  Потом подумала и второй раз написала письмо и отправила его.


  Ну что же я такая несчастная?


  А ты кем работаешь?


  — Как кем?— Не видишь, что ли?— Строителем! У меня теперь такая профессия— строитель амбаров
  для морковки!— Профессия! Мне тоже нужна профессия! Иначе нечем будет заниматься.


  А что ты мне посоветуешь? Ну, это ты сама должна решить. Всё, мне некогда. Я побежал. Разговор
  с Крошем сильно озадачил Нюшу. Теперь она точно решила, что ей нужна профессия. И Нюша направилась
  к Ёжику.


  Справа по борту полный вперёд право руля свистать всех наверх Необходимо определить координаты.


  Ёжик! Ёжик! Почему?


  Не мешай.


  Я думаю.


  — А ты о чём думаешь?— О том, как хорошо быть моряком!— Точно! Быть моряком! Это так потрясно!
  Плавать по морю, играть с дельфинами, кормить чаек!


  А потом можно вернуться домой и попросить поэта нам описать всё это в книжке Стального цвета!
  Здорово! Ёжик! А почему сразу нельзя стать поэтом? Но поэт у нас уже есть это Бараш.


  Бараш. Так что нам остаётся быть только моряком или пожарным. А может, всё-таки лётчиком?


  Пойду-ка я лучше к Барашу. Я и не знала, что у него такая красивая жизнь.


  Жук и рак сошлись у речки. Жук и рак сошлись у речки, разговаривать словечки, выясняли,
  кто сильней мерились клешнями. Нет, нет, совсем не в рифму.


  Может, они хвостами мерились? Нет. Нет.


  — Ты чего, Нюша?— Смотрю, как работает поэт!— Хм, только не мешай мне.— Я вовсе тебе не
  мешаю. Просто мне очень нравится твоя работа.


  А не могла бы ты смотреть на неё не так пристально?


  Так начали заново. Жук и рак сошлись у речки разговаривать словечки выясняли, кто сильней.
  У кого усы длинней? Я так не могу.


  — Ерунда какая-то! Хочешь, бери и сочиняй сама!— А можно?— Каждый думает, что это так легко,
  и каждый обязательно лезет отвлекать. Вот увидишь, когда тебе мешают, рифмы от тебя, ну,
  просто разбегаются.


  Ну-ка, ну-ка! Ага! Жук и рак сошлись у речки разговаривать словечки. Выясняли, кто сильней,
  у кого усы длинней. Получается! У меня получается! Это, это просто невероятно!


  Ого! Ого! Та-та-та! Папа, папа, ты там с тобой!


  Ого-го! Пам-пам.


  Не надо мне Знаешь? Спасибо тебе, что научил сочинять меня стихи Как здорово! Одно я уже
  сочинила. Теперь пойду сочинять другое.


  Бараш! А как это называется, когда всё на свете получается, и даже сочинять стихи? Это называется
  вдохновение. Не то это.


  А это уже было'
