id: osnovnoy_instinkt
title: Основной инстинкт
text: 'Убери ручка следующий.


  Нет, ну ты мне скажи, а почему ты не играешь в те игры, в которые играют все остальные девчонки?
  А? Это в какие ещё?


  Ну, например, в куклы или в дочки-матери. Чего ты с нами носишься? Как ужаленный поросёнок?


  Это ты так говоришь, потому что я у вас всё время выигрываю! Нет! Ёжик, подожди, разговор
  очень серьёзный. Я это говорю, потому что мне грустно смотреть, как ты тратишь своё детство
  не на те игры.


  А мне нравится! А в куклы ещё больше понравится! Ты же просто не пробовала? Ай! У меня и
  кукол-то нет! Я тебе сделаю. А в дочки-матери можно играть и без кукол. Ты— мама, а Ёжик,
  например, дочка. Э-э, ну, в смысле, сын.


  А почему я?


  Потому что я пошёл делать куклу.


  Э-э! А чего делать-то? Ёлки-иголки! Где твой материнский инстинкт? Ну, представь, что ты
  мама Ёжика, заботишься о нём и всё такое. Это очень интересная игра.


  Заботиться Может, ты есть хочешь? Неплохая идея.


  Ещё нет, спасибо. Подожди.


  Вот такие.


  А теперь чистить зубки и спать.


  — Но я не хочу спать.— Я лучше знаю, что ты хочешь, а что нет. Не забывай!— Мама, это я!
  Бараш!


  Привет, Ёжик. Куда пропал?


  Слушай, лучше не спрашивай. Скажи, ты скоро сделаешь куклу для Нюши? А то я уже больше не
  могу. Почти всё готово.


  Марюшки мою не ложись на краю.


  Ёжик! Я же тебе сказала гулять возле дома! А ты куда убежал? Ты должен меня слушаться! А
  ты меня расстраиваешь! У всех сыновья как сыновья, а у меня горе луковое!


  Видишь? Вы до чего доигрались Держи! Играй на здоровье!


  — Вы-то куда?— Ёжик! Я тебе не разрешаю надеть шапку! Ты можешь простудиться Кажется, зря
  мы затеяли эти дочки матери. Как бы это всё плохо ни кончилось. Ничего, ничего! Это у неё
  с непривычки. Материнский инстинкт— это ни хухры, ухры!


  Крош.


  — Ты, конечно, можешь дружить с Ёжиком, но мне не нравится, какое влияние ты на него оказываешь.
  Он стал циничным и равнодушным, плохо питается и совершенно меня не слушается. Верни мне
  моего мальчика!— Отпусти его! Ты совсем спятила!— Неблагодарный! Немедленно вернись!


  Ты разбиваешь мне сердце А в чём дело? Подождите.


  Заигравшаяся моя. Сейчас я вам всё объясню.


  Дело такое, что ей сейчас очень трудно что-то объяснить. Она в отчаянии, и самым правильным
  будет ей сейчас немного подыграть.


  Только не я.


  Ёжик, будь мужчиной! Посмотри, как ей плохо! Ну неужели тебе так трудно? Да, Ёжик, ну потерпи
  чуть-чуть. Она поиграет немного, а потом ей надоест. В конце концов, кроме материнского,
  есть ещё много других инстинктов.


  Возвращение блудного сына. Как это, как это замечательно! Да, может, ой, сыграем партейку?


  Давайте.


  А когда ты вырастешь, я отдам тебя в музыкальную школу!


  Мама!'
