id: skameyka
title: Скамейка
text: 'Как-то кролик Крош захотел сделать что-нибудь полезное для своего домика, он решил
  смастерить скамейку, чтобы сидеть на ней с друзьями по вечерам.


  Он делал её несколько дней, наконец сделал и покрасил. Рядом с Крошом жил Ёжик, который
  часто заходил к нему в гости. Здравствуй, Крош. Крош! А! Привет, Ёжик! Сделал.


  Ну так, вот, понимаешь, жду, когда высохнет краска.


  Красивая получилась лавочка. Скорее бы, понимаешь, сесть на неё. Ты какой краской красила?
  Быстросохнущей или долгосохнущей? Неизвестно. Да, она, наверное, уже высохла.


  Нет, понимаешь, не высохла. Наверное, это долго сохнущая краска. Крош не любил ждать. Он
  привык проводить время с пользой. В принципе, пока краска сохнет, можно сделать ещё что-нибудь
  полезное.


  У меня, понимаешь, как раз краска осталась. Тебе ничего не надо покрасить.


  Вроде и нет. Жаль. А давай тебе покрасим. Нет, вспомнил, Барашу, наверное, нужно что-нибудь
  покрасить. Ну так что же ты раньше молчал?


  Бараш сочиняла стихи. Но сегодня стихи никак не хотели сочиняться. Бараш! Бараш! Бараш!


  Не кричите так громко!


  — Вы спугнёте моё вдохновение!— Что-то я не вижу никакого вдохновения. Наверное, мы его
  всё-таки спугнули.


  Вдохновения увидеть нельзя.


  Его можно только почувствовать. А как его можно это почувствовать? Это когда что-то сонное,
  ленивое, очень тяжёлое и неподъёмное, как бегемот.


  становится лёгким, как облако и летим лети.


  Что-то я запутался. Сначала, понимаешь, вдохновение, теперь бегемот. Чего тут непонятного?
  Бегемот— это образ, как бы что-то тяжёлое, когда ничего не получается!


  А когда приходит вдохновение, то всё получается — Что это у тебя?— Краска!— Я же говорил,
  что у Бараша всегда найдётся что покрасить.


  — Кто это?— Пара?— Это. Кое-кто думал, что это стихи.— Этот кое-кто ты.— Какая разница,
  если стихи не получились? Нет, это мы оставим.


  — Может, покрасить полезное что-то?— Сначала закрасим листки из блокнота. О, может получиться
  неплохой стишок. Надо записать.— Но ты же, так сказать, закрасил всю бумагу.— Ерунда. Стихи
  можно писать везде.— Хочешь покрасить полезное что-то?


  Вырви сначала листок из блокнота и в тишине! На листке из блокнота— Ты не спеша, нарисуй!
  Скамейку! Не подходит! Нужна рифма. Нарисуй бегемота! А что, если мешайте, у меня вдохновение!
  Жизнь бегемота— сплошные заботы, Дом бегемота, пески и болота. Хочешь покрасить полезное
  что-то?


  То-то, что тут решать? Разукрасить бегемота и весь он от ушей до живота будет полезен он
  даже с комедия — Ой! Что это с ним? Он опять выглядит грустным.— Наверное, так сказать,
  вдохновение кончилось.— Бараш!— Ну так ты ещё долго собираешься сидеть на дереве?— Я не
  могу слезть.— Видимо, он ждёт, когда высохнет краска.— Нет, я не могу слезть, потому что
  я боюсь высоты.


  — Зачем же ты залез туда?— Это как-то само собой получилось!— Не волнуйся, мы тебя сейчас
  это снимем.


  Так сказать, не достать. Надо ещё чего-нибудь. Бежим ко мне!


  Розё, где вы? Сейчас это снимем. Больше ничего нет.


  Нет! Есть!


  Всё уже кончилось.


  Окрашено.


  Красивая была скамеечка.


  — Крош, Ёжик! Ну вы же спасли меня от своего друга! Может быть, я ошибаюсь, но мне кажется,
  что я всё-таки полезнее, чем скамейка. Даже такая красивая.


  Ну так Бараш. Конечно! Скамеек я могу сделать сколько угодно. А ты у нас такой, понимаешь,
  один! Ёжик так растрогался, что, чтобы не заплакать от счастья, посмотрел на небо. Смотрите,
  летит! Это Бегемот раскрашенный! Ура-ра! Ура! Бегемот Бегемот! Ура! Бегемот!


  Пара'
