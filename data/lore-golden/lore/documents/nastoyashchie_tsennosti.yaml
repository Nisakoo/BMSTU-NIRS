id: nastoyashchie_tsennosti
title: Настоящие ценности
text: 'Ёлки-галки!


  Сорок ящиков морковки.


  Ёжик! У меня юбилей! Сорок ящиков морковки!


  Поздравляю! Нет, ты только подумай! Кажется, ещё вчера их было 30. А вот, пожалуйста, уже
  40. Отдай саву не она варенье сделает.


  Да ты что?


  Да я их полгода копил! А ты отдать? Да у меня может ничего дороже нету!


  Я просто подумал: куда тебе столько морковки? Куда? А куда тебе столько фантиков? Ты ведь
  свою коллекцию никому не отдашь. Ведь не отдашь, да? Ну, я не знаю. Да ясно, что не отдашь.
  Туда же варенье.


  Крош! Ты чего там?


  Заснул, что ли?


  Ага, вот ты где! А я стучу, стучу. Слушай, мне фонарик нужен. Одолжи ненадолго, а Фонарик
  не могу. Самому нужен.


  Это что у тебя там? Морковка! Сорок ящиков! Ух ты!


  А куда деть столько морковки? Морковки много не бывает.


  А хочешь? Я тебе за фонарик морковку дам! Вот Почти целая! Только раз укусила!


  Вся прелесть моей ирригационной системы состоит в том, что вода поступает равномерно на
  все, даже самые отдалённые участки плантации. Сколько их надо крутить? Эти педали всё время
  Всё время! Что ж ты мне раньше не сказал? Я ж копать должен! Ну, знаете ли, занятой вы мой,
  моё дело придумать, как поливать, а уж кто будет поливать, решайте сами. Мне кажется, что
  с этой работой справится кто угодно.


  В общем, дело такое. Не могла бы ты это, если, конечно, не очень занята? В общем, покрути,
  пожалуйста, вот эти педали.


  Ящик морковки! Чего? Ящик морковки.


  Давай ящик морковки покручу! А, ну так, конечно, если хочешь, даже два.


  Ну, всё, хватит на сегодня. Славно, славно поработали. Молодцы.


  Лосяша.


  Ой, Лосяша.


  — Ты не поможешь мне довезти мою морковку домой?— Э-э-э, три ящика морковки.— О-о-о.


  — Копатыч, вот веришь? Ну позарез надо!— Ну пожалуйста, ну сделай, будь другом!— Пятьдесят!—
  Но у меня нет столько морковки.


  Хорошо. Для тебя по старой Дружбе 40.


  Крош. Я тут думал о том, что ты мне сказал.


  И знаешь, мне кажется, ты был прав.


  Ну, про фантики там и вообще Это всё неважно. Фантики— это, в общем, просто фантики. И морковки,
  просто морковки.


  Ага, моя коллекция Я её очень долго собирал.


  Но для тебя Вот.


  Ёжик.


  Ты и представить себе не можешь, как я тебе... Сколько морковок я тебе буду должен?


  Нисколько Это подарок Крош! Слушай! Мне морковку хранить негде! Одолжи свой подвал! А я
  тебе за это три ящика морковки дам!


  Что, мало трёх? Ну, хочешь четыре?


  Ну хорошо. Если ты такой жадный, я тебе дам пять ящиков морковки. Но это уже грабёж.


  Морковка! Морковка, морковка! Что такое морковка?! Нельзя же всё в этой жизни оценивать
  в морковках! Ведь есть же и другие ценности, настоящие, которые дороже всего на свете! Вот!
  Смотри!


  Да, и за подвал. Ты мне будешь должна 20 фантиков.'
