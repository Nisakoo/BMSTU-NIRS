id: ee_zvali_nyusha
title: Её звали Нюша
text: 'Меня зовут Корнелия. Это очень благородное и звучное имя. Если вы читаете книги, то
  должны знать, что Корнелиями называют принцесс и гордых дам.


  Корнелий необычайно умный, умеет держать судьбу за хвост и входить в историю. Ну что?


  Теперь вам понятно? С кем вы имеете дело?


  Итак Удар года! Ну что? Ну давай пас мне! Ух ты! Ну, ёлки-иголки! Берегись! Так, талантливая
  комбинация! Крош, выходит к воротам!


  Промахнуться?


  Нюша, прими мячик, пожалуйста.


  А! Пни мяч! Чего вредничать, Нюша? Сведения о том, что кого-то здесь зовут Нюшей, устарели.
  Если хотите у меня что-то попросить или выразить своё восхищение, называйте меня просто
  Корнелией.


  А теперь пойдёмте со мной. Я научу вас играть в игры, которые помогут вам развить интеллект
  до пристойного.


  Вперед вырывается Крош! Ну-ка! Ужасник ты козла, вот так вот Что, заскучали? Давайте играть
  и веселиться в догонялки! Крош, ты будешь? Ау! Слушай, ты Корнелия! Я уже не Корнелия! Я
  Джоконда! Что означает весёлая и жизнерадостная!


  Я пришла развеять вашу скуку Ой! Я, кажется, разбил себе лицо.


  Крош. Надо поторопиться. К нам бежит жизнерадостная Джоконда.


  Я не хочу веселиться. Как я тебя понимаю! Как я тебя понимаю! Джоконда.


  Элеонора.


  Элеонора! Сострадающая! Я так и думал.


  — Крош!— Посмотри, какое имя означает отмороженная.— Нет.


  Зимняя. Яблоковое, яблоковое, а яблочное Поликарп-плодоносный. Лосяш, это же мужское имя.


  Точно.


  — Что ты за нами ходишь?— Меня зовут Амина.


  Что означает верная? А меня зовут Крош. Что означает кончай ходить за нами?


  Теперь мы можем называть тебя Маланья. Что означает чёрная?


  Ну как же быть? Как же называться? Ведь любое имя про меня! Но я же не могу остановиться
  на одном и отказаться от остальных! Я же и покорная, и спокойная, и милосердная, и прекрасная,
  и победоносная!


  Красная, и пламенная, и снежная, и богатая. И эта, как её? Гертруда могучее копьё Ладно,
  не хнычь, что-нибудь придумаем. Правда? Ёжик? Или ты тоже уже не Ёжик? Зови меня, хозяин.
  Не ошибёшься.


  Фелиция означает счастливая? Конечно Ага. Фелиция. Аделе благородная. Разумеется! Ага. Аделя
  или Оделе?


  А вот Изольда. Угу.


  Визуально! Тьфу! Визольдо! Помедленнее! Я не успеваю записывать. И вообще, дай сюда.


  Вся.


  Итак, твоё полное имя: Эмили Августа Сусано, Джульетта Глория, Даниила Енара, Валерий Лозин,
  Гюльчатай, Юнона, Аврора, Анжелика Ядвига, Нора, Эльвира, Элизабет, Земфира. Вероника Рядна,
  Виктория Тереза Мария Эсмиральдо.


  Изабелла Корнелия Корнелия.


  Всё Пошли! А-а-а эта Эмилия Августа, Джульетта и, в общем, как её там? Да зачем же так официально?
  Ха-ха. Эй, для своих я просто Нюша.


  А'
