id: miss_vselennaya
title: Мисс Вселенная
text: 'Итак Второе Чрезвычайно почётное, можно сказать, серебряное, с позолотой место на конкурсе
  красоты нашей области занимает Совунья!


  Остаётся назвать победителя.


  Итак, королевой красоты и грации единодушным решением жюри избирается Ах, какая грациозная!


  Дорогие друзья! Победительница получает приз Банку с вишнёвым вареньем и колесо от велосипеда,
  символизирующее идеальную фигуру! Фигуру круга. А также мы отправляем нашу королеву на участие
  в главном конкурсе красоты мисс Вселенная!


  Ой!


  Считай, что победа уже у тебя в копытах! У меня даже воображения не хватает, чтобы представить,
  как можно быть красивее. Рад бы возразить! Да нечем! Пошли их на променад. Ну как? Красотка,
  а! Красотка! Осоля Ми! Ну просто Вита какая-то! Фантастиш! Гармония, поверенная алгеброй,
  красота плюс грация, помноженная на обаяние, и всё это в квадрате, в кубе, в бесконечности,
  настоящее


  Настоящая мисс Вселенная! Сейчас я покажу вам ваши будущие владения.


  Лосяш.


  Письмо! Письмо! Пришёл ответ с конкурса!


  Я что-то не поняла.


  Этот Я что? Я не подхожу! Как так?


  — Ты красавица!— Видишь ли?— Это интриги! Они не могут без этого.— Так. Я же не подхожу
  ни по одному параметру!


  У меня же всё наоборот. Конечно, не красавица. Клоуном без грима работать можно. Какой-то
  пельмень с глазками!


  Нюша! Оставьте меня в покое! Зачем вы мне лгали? Вы же всё прекрасно знали! Нюшу! Нельзя
  так обманывать! Если бы вы мне сразу сказали, что я дурнушка, я не была бы такой круглой
  дурой! А то королева красоты!


  Королева красоты! Хотели посмеяться надо мной? У вас это получилось? Ведь одна награда—
  смех!


  Нюша! Ну куда ты убежала?


  — Поверь, что для нас никого красивее тебя нету!— Значит, у вас плохой вкус!— Почему у нас?
  Может, у них плохой вкус?— Если не суждено стать мисс Вселенной. Какой смысл вообще прихорашиваться?—
  А как же мы? Ведь у нас тоже своя вселенная!— Как же мы?


  Без королевы красоты.


  По причине полного расхождения во вкусах и оценке прекрасного наше сообщество отделяется
  от остальной Вселенной и провозглашает свою независимую вселенную со своими параметрами
  вкуса и изящества. Так как этим параметрам идеально соответствовать Приветствует всем известную
  душу она безоговорочно провозглашается королевой красоты и мисс Нашей Вселенной! И что же
  я теперь должна следить за своей красотой, умываться там и всячески прихорашиваться, что
  ли?


  Что ли? Ещё чё?


  Ну ладно! Я согласна.


  Зачем мне это надо?


  Ой, сама не знаю.'
