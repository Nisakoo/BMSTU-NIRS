id: kuda_privodyat_zhelaniya
title: Куда приводят желания
text: 'Нюша Душевная душа — Может, подсказать что?— Мне нужна инструкция по изготовлению волшебной
  палочки.— Угу.— Зачем тебе волшебная палочка?— Мне нужно сделать так, чтобы ветер никогда
  не дул. А без волшебной палочки тут не обойтись.


  Ты рассуждаешь логично, но есть одно«но: волшебных палочек не бывает».


  Если их не бывает, то о них бы никто и не говорил. Зачем говорить о том, чего нет? Ну-ну.
  Удачи.


  Зря стараешься. Ой. Если бы кому-то уже удалось сделать волшебную палочку, ой, то не было
  бы комаров.


  Ну ладно, я спать.


  Я профессор Медведев, которому приснилось, как нужно упорядочить химические элементы. Ой,
  а вы бы, а вы бы не могли бы сделать так?


  Чтобы мне приснилось, как нужно делать волшебную палочку. Ага, это же просто, как стакан
  каши. Итак, записывайте.


  Пишите.


  И хочу, чтобы ветер чтобы не дул.


  Фу! Ну наконец-то причёску.


  Посовременнее.


  Нюша мой Ой. Что-то без ветра жарковато.


  Пусть солнце больше не печёт.


  Меня же не видно! Ну включите какое-нибудь электричество, что ли.


  Белый парусник. Принца.


  Поплыли.


  Ветра нет. Мадмуазель.


  Ой.


  Пожалуйста, люди.


  Нюша ты видела вчера солнечное затмение? Я пишу заметку в научное общество было полное безветрие,
  потом электромагнитная буря, а потом... Это я палочкой. Какой палочкой? Волшебной.


  Ты серьёзно? Покажи.


  Я её выбросила! А? А? Почему ты её выбросила? Я чуть было не поверила.


  То получаешь не совсем то, что хочешь, то получаешь, а уже не хочешь. А то и вообще не понять,
  что хочешь на самом деле.


  Я в детстве тоже хотела иметь волшебную палочку, чтобы сразу стать старенькой, как моя бабушка,
  получать пенсию и ничего не делать. Хорошо, что у меня не было волшебной палочки. Слушайте,
  мне же сегодня Менделеев снился. Мы с ним разговаривали о чём-то важном, он мне что-то рассказывал.


  Не помнишь.'
source: Куда_приводят_желания.txt
