id: ballast
title: Балласт
text: '— Вот смотри, у нас очень удобная лагуна. Рифов нет, течение спокойное. Если бы ты
  был пиратом, то стал бы искать что-нибудь лучше для своих сокровищ?— Не знаю. И я бы не
  стал.


  Они где-то здесь.


  Ну и куда это вы собираетесь? За сокровищами пиратов.


  Ой, не могу! Дураки! Они идут за сокровищами! Ой! Держите меня! Я падаю!


  А вы что под водой поплывёте?


  Я тоже хочу покататься на этой, как её, подлодке!


  Подлодке! Мест нет.


  Как это нет?


  Сейчас уберём весь мусор, и место появится.


  Май!


  Это не я. Это балласт.


  Я Буду вместо балласта.


  Какая прелесть! Они где-то рядом. Сокровища где-то рядом. У меня на них нюх.


  Да и теперь я посмотрю! Я, в отличие от некоторых, делом занимаюсь!


  Сокровища! Сокровища!


  Учебная тревога Женщина на корабле плохой примета.


  Там что-то есть.


  Стоп! Машина!


  Ладно. Поехали домой! А то я уже есть хочу. Куда тут надо тыкать-то? Сюда что ли? Найн!
  Нет, нет.


  Ой!


  Они где-то здесь.


  Прекрасное место для пиратских сокровищ.


  Ой, а тут кто-то вещи забыл.


  Сокровища! Ура! Ура!


  Быстрей отсюда! Быстро! Быстро! А как же сокровища?


  Что это у тебя?


  Да так балласт.


  В пещере нашла.


  Ёлки-иголки! Нюша! Сокровище ты наше! Это же настоящий пиратский гвоздь! Вот как всегда.
  Для кого-то балласт, а для кого-то сокровище!'
