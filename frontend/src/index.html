<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Истории со Смешариками — AI чат</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="sai" aria-label="Сервис генерации историй со Смешариками">
  <aside class="sai-sidebar" id="saiSidebar" aria-label="Мои истории">
    <a class="sai-brand" href="/"><span class="sai-mark" aria-hidden="true">✦</span>Смешарики AI</a>
    <button class="sai-new" id="saiNewStory" type="button" disabled>+ Новая история</button>

    <h2 class="sai-history-title">Мои истории</h2>
    <nav class="sai-history-wrap" aria-label="Сохранённые истории">
      <ul class="sai-history" id="saiHistory"></ul>
      <p class="sai-history-state" id="saiHistoryState">Загрузка…</p>
      <button class="sai-history-retry" id="saiHistoryRetry" type="button" hidden>Повторить</button>
    </nav>

    <a class="sai-admin-link" id="saiAdminLink" href="/admin/" hidden><span aria-hidden="true">⚙</span>Панель администратора</a>
    <button class="sai-settings-button" id="saiSettingsButton" type="button" aria-haspopup="dialog" aria-controls="saiSettings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Настройки</button>
    <div class="sai-user">
      <span class="sai-user-avatar" aria-hidden="true">✦</span>
      <span class="sai-user-login" id="saiUserLogin"></span>
      <button class="sai-logout" id="saiLogout" type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10 8l-4 4 4 4M6 12h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Выйти</button>
    </div>
  </aside>
  <div class="sai-backdrop" id="saiBackdrop" hidden></div>

  <div class="sai-settings" id="saiSettings" hidden>
    <div class="sai-settings-card" role="dialog" aria-modal="true" aria-labelledby="saiSettingsTitle">
      <div class="sai-settings-head">
        <h2 class="sai-settings-title" id="saiSettingsTitle">Настройки</h2>
        <button class="sai-settings-close" id="saiSettingsClose" type="button" aria-label="Закрыть" title="Закрыть">×</button>
      </div>
      <form class="sai-password" id="saiPasswordForm" novalidate>
        <h3 class="sai-password-title">Сменить пароль</h3>
        <label class="sai-password-field">Текущий пароль
          <input id="saiCurrentPassword" type="password" autocomplete="current-password" required />
        </label>
        <label class="sai-password-field">Новый пароль
          <input id="saiNewPassword" type="password" autocomplete="new-password" required />
        </label>
        <label class="sai-password-field">Повторите новый пароль
          <input id="saiRepeatPassword" type="password" autocomplete="new-password" required />
        </label>
        <p class="sai-password-status" id="saiPasswordStatus" aria-live="polite"></p>
        <button class="sai-password-save" id="saiPasswordSave" type="submit">Сохранить</button>
      </form>
    </div>
  </div>

  <main class="sai-main" aria-label="Чат с ИИ">
    <div class="sai-stars" aria-hidden="true"></div>
    <div class="sai-landscape" aria-hidden="true">
      <svg viewBox="0 0 1200 430" preserveAspectRatio="none">
        <defs>
          <linearGradient id="saiHillBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d5a4c"/><stop offset="1" stop-color="#123b34"/></linearGradient>
          <linearGradient id="saiHillMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#246b55"/><stop offset="1" stop-color="#174738"/></linearGradient>
          <linearGradient id="saiGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d7a57"/><stop offset=".62" stop-color="#225e47"/><stop offset="1" stop-color="#153f34"/></linearGradient>
        </defs>
        <path d="M0 191 C118 132 224 137 338 189 C451 240 551 170 671 160 C815 149 901 229 1018 196 C1087 176 1143 153 1200 171 L1200 430 L0 430 Z" fill="url(#saiHillBack)"/>
        <path d="M0 244 C146 183 253 197 384 246 C523 299 609 216 752 211 C899 206 994 279 1200 221 L1200 430 L0 430 Z" fill="url(#saiHillMid)"/>
        <path d="M0 286 C198 243 340 266 503 301 C667 337 820 275 983 274 C1085 274 1148 289 1200 306 L1200 430 L0 430 Z" fill="url(#saiGrass)"/>
      </svg>
    </div>

    <header class="sai-chat-head">
      <button class="sai-history-toggle" id="saiHistoryToggle" type="button" aria-controls="saiSidebar" aria-expanded="false">Истории</button>
      <div class="sai-heading">
        <h1 class="sai-title" id="saiTitle">Новая история</h1>
        <div class="sai-status" id="saiStatus" role="status" aria-live="polite" data-state="connecting">
          <i></i><span id="saiStatusText">подключение…</span>
        </div>
      </div>
    </header>

    <div class="sai-news" id="saiNews" role="status" hidden></div>
    <div class="sai-messages" id="saiMessages" aria-live="polite"></div>
    <template id="saiKroshTemplate">
      <div class="sai-krosh">
        <div class="sai-krosh-pic"><img src="./static/characters/krosh.png" alt="Крош" width="420" height="420" decoding="async" /></div>
        <p class="sai-krosh-say"><b>Ёлки-иголки, привет!</b> Я Крош. Давай сочиним что-нибудь такое, чтобы даже Кар-Карыч удивился! Кого берём в историю и куда отправимся?</p>
        <p class="sai-krosh-sub">Напиши идею или выбери тему ниже</p>
      </div>
    </template>
    <!-- Мордашки оценки ответа: 1 — грусть, 5 — восторг -->
    <template id="saiFacesTemplate">
      <img data-score="1" src="./static/faces/1-ezhik.png" alt="" width="72" height="72" />
      <img data-score="2" src="./static/faces/2-nyusha.png" alt="" width="72" height="72" />
      <img data-score="3" src="./static/faces/3-losyash.png" alt="" width="72" height="72" />
      <img data-score="4" src="./static/faces/4-kopatych.png" alt="" width="72" height="72" />
      <img data-score="5" src="./static/faces/5-krosh.png" alt="" width="72" height="72" />
    </template>

    <div class="sai-compose-wrap">
      <form class="sai-composer" id="saiForm">
        <textarea id="saiPrompt" rows="1" placeholder="Например: Крош и Ёжик строят ракету и отправляются смотреть звёзды…" aria-label="Идея для истории" disabled></textarea>
        <button class="sai-length-button" id="saiLengthButton" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="saiLengthPanel" aria-label="Длина истории: Любая" disabled>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="saiLengthValue">Любая</span>
        </button>
        <div class="sai-length-panel" id="saiLengthPanel" role="dialog" aria-label="Длина истории" hidden>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="sai-length-title">Длина истории <span id="saiLengthCurrent">(любая)</span></span>
          <div class="sai-length-dots" id="saiLengthDots" data-step="0">
            <i></i><i></i><i></i><i></i>
            <input type="range" id="saiLength" min="0" max="3" step="1" value="0" aria-label="Длина истории" aria-valuetext="Любая" disabled />
          </div>
        </div>
        <button class="sai-send" type="submit" aria-label="Отправить" disabled>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.4 20 5l-5.8 14-2.5-5.1L4 12.4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m11.7 13.9 3.5-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </form>
      <div class="sai-chips">
        <button class="sai-chip" type="button" aria-pressed="false" disabled>Про дружбу</button>
        <button class="sai-chip" type="button" aria-pressed="false" disabled>Приключение</button>
        <button class="sai-chip" type="button" aria-pressed="false" disabled>Перед сном</button>
        <button class="sai-chip" type="button" aria-pressed="false" disabled>В космосе</button>
        <button class="sai-chip" type="button" aria-pressed="false" disabled>Про чувства</button>
        <button class="sai-chip" type="button" aria-pressed="false" disabled>Поучительная</button>
      </div>
    </div>
  </main>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
