# An explicit name keeps this project apart from other compose files in `docker/` dirs.
name: smeshariki-ai

x-backend-image: &backend-image ${COMPOSE_PROJECT_NAME}-backend${BACKEND_IMAGE_SUFFIX:-}

x-backend-environment: &backend-environment
  AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-4}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-human}
  LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL in docker/.env}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  LLM_NUM_RETRIES: ${LLM_NUM_RETRIES:-0}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.8}
  LLM_THINKING: ${LLM_THINKING:-false}
  RAG_QUERY_EXPANSION_ENABLED: ${RAG_QUERY_EXPANSION_ENABLED:-false}
  RAG_QUERY_EXPANSION_MODE: ${RAG_QUERY_EXPANSION_MODE:-replace}
  RAG_LORE_RETRIEVAL_K: ${RAG_LORE_RETRIEVAL_K:-10}
  RAG_LORE_MAX_PASSAGES: ${RAG_LORE_MAX_PASSAGES:-5}
  RAG_LORE_MAX_CHARS: ${RAG_LORE_MAX_CHARS:-4800}
  RAG_LORE_MIN_SCORE: ${RAG_LORE_MIN_SCORE:-2.0}
  RAG_LORE_RERANK_ENABLED: ${RAG_LORE_RERANK_ENABLED:-false}
  RAG_HYBRID_ENABLED: ${RAG_HYBRID_ENABLED:-false}
  RAG_HYBRID_BM25_WEIGHT: ${RAG_HYBRID_BM25_WEIGHT:-0.7}
  HF_HOME: /models/hf
  SPEECH_ENABLED: ${SPEECH_ENABLED:-false}
  SPEECH_VOICE: ${SPEECH_VOICE:-baya}
  SPEECH_SPEED: ${SPEECH_SPEED:-1.0}
  SPEECH_MAX_CONCURRENCY: ${SPEECH_MAX_CONCURRENCY:-1}
  SPEECH_MAX_TEXT_CHARS: ${SPEECH_MAX_TEXT_CHARS:-20000}
  SPEECH_MODEL_PATH: ${SPEECH_MODEL_PATH:-/models/silero/v5_ru.pt}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in docker/.env}
  AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-900}
  AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-2592000}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_LOGIN_MAX_FAILURES: ${AUTH_LOGIN_MAX_FAILURES:-5}
  AUTH_LOGIN_FAILURE_WINDOW_SECONDS: ${AUTH_LOGIN_FAILURE_WINDOW_SECONDS:-900}
  AUTH_LOGIN_MAX_PER_IP: ${AUTH_LOGIN_MAX_PER_IP:-30}
  AUTH_LOGIN_PER_IP_WINDOW_SECONDS: ${AUTH_LOGIN_PER_IP_WINDOW_SECONDS:-60}
  AUTH_REGISTER_MAX_PER_IP: ${AUTH_REGISTER_MAX_PER_IP:-10}
  AUTH_REGISTER_PER_IP_WINDOW_SECONDS: ${AUTH_REGISTER_PER_IP_WINDOW_SECONDS:-3600}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smeshariki}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}@postgres:5432/${POSTGRES_DB:-smeshariki}
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smeshariki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-smeshariki}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: *backend-image
    pull_policy: never
    volumes:
      - hf-cache:/models/hf
    command: ["python", "-m", "smeshariki_ai.db.migrate"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: *backend-image
    pull_policy: never
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SPEECH_ENABLED: ${SPEECH_ENABLED:-false}
        RAG_HYBRID_ENABLED: ${RAG_HYBRID_ENABLED:-false}
    volumes:
      # The dense model is downloaded once and reused by the container.
      - hf-cache:/models/hf
    environment:
      <<: *backend-environment
      # Uvicorn trusts X-Forwarded-For only from Caddy's fixed address.
      FORWARDED_ALLOW_IPS: 172.31.250.250
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"
    networks:
      default:
        ipv4_address: 172.31.250.250

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          # Dynamic addresses stay below Caddy's fixed one.
          ip_range: 172.31.250.0/25

volumes:
  postgres-data:
  hf-cache:
