server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep directory redirects (/login -> /login/) relative, so the external
    # Caddy port is preserved.
    absolute_redirect off;

    # HTML, including pages served through index, is always revalidated.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Vite puts content-hashed files here.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
